<title>Gran Felicitá Vôlei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#940B29">
<link rel="icon" type="image/png" href="{{ICON}}">
<link rel="apple-touch-icon" href="{{ICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Identidade Gran Felicitá: grená #940B29, dourado #D2A95A, marinho #2E4670, cinza #6F6F6F, gelo #F1F1F1.
   Layout: coluna única de celular; cabeçalho grená com o escudo e a andorinha; navegação fixa embaixo. */
:root {
  --bg: #F1F1F1; --surface: #FFFFFF; --surface-2: #F6F6F7; --ink: #1B2640; --muted: #5F6472; --line: #E0E0E3;
  --court: #940B29; --court-deep: #6E061D; --court-ink: #FFFFFF; --court-soft: #F7E4E8;
  --navy: #2E4670; --navy-ink: #FFFFFF; --link: #2E4670;
  --ball: #D2A95A; --ball-ink: #2A1D05; --ball-soft: #F6ECD8;
  --ok: #1E7A4C; --ok-soft: #DDF1E6; --warn: #9A5A06; --warn-soft: #FBEBD2; --danger: #B3122F; --danger-soft: #FBE1E5;
  --shadow: 0 1px 2px rgb(27 38 64 / .06), 0 6px 20px rgb(27 38 64 / .05);
  --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --serif: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1322; --surface: #161E33; --surface-2: #1C2640; --ink: #EEF0F5; --muted: #A3A9B8; --line: #2A3450;
  --court: #B81538; --court-deep: #7A0820; --court-ink: #FFFFFF; --court-soft: #3A1420;
  --navy: #3D5A8C; --navy-ink: #FFFFFF; --link: #9DB6E4;
  --ball: #DDB66A; --ball-ink: #2A1D05; --ball-soft: #3A2F18;
  --ok: #4CC98A; --ok-soft: #133326; --warn: #EBAB55; --warn-soft: #3A2A12; --danger: #FF6F86; --danger-soft: #3D1520;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1322; --surface: #161E33; --surface-2: #1C2640; --ink: #EEF0F5; --muted: #A3A9B8; --line: #2A3450;
  --court: #B81538; --court-deep: #7A0820; --court-ink: #FFFFFF; --court-soft: #3A1420;
  --navy: #3D5A8C; --navy-ink: #FFFFFF; --link: #9DB6E4;
  --ball: #DDB66A; --ball-ink: #2A1D05; --ball-soft: #3A2F18;
  --ok: #4CC98A; --ok-soft: #133326; --warn: #EBAB55; --warn-soft: #3A2A12; --danger: #FF6F86; --danger-soft: #3D1520;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-family: var(--display); font-weight: 400; }
h2 { font-family: var(--body); font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-family: var(--body); font-weight: 800; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
main { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hint { font-size: .88rem; color: var(--muted); margin: 0; }
.demo { background: var(--ball-soft); color: var(--ink); border: 1px dashed var(--ball); border-radius: 12px; padding: 10px 12px; font-size: .86rem; }

/* Cabeçalho grená com escudo, estrelas douradas e a andorinha */
.court { position: relative; overflow: hidden; border-radius: 22px; color: var(--court-ink); padding: 16px 16px 18px;
  background:
    radial-gradient(120% 90% at 100% 100%, rgb(46 70 112 / .55), transparent 60%),
    linear-gradient(165deg, var(--court), var(--court-deep));
  display: grid; gap: 12px; box-shadow: inset 0 0 0 1.5px rgb(210 169 90 / .55); }
.court::after { content: ""; position: absolute; inset: 7px; border: 1px solid rgb(255 255 255 / .16); border-radius: 16px; pointer-events: none; }
.court > * { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 62px; height: 62px; flex: none; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .35)); }
.brand .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }
.eyebrow { font-family: var(--serif); font-size: .92rem; letter-spacing: .08em; font-weight: 700; color: var(--ball); line-height: 1.1; }
.eyebrow .stars { letter-spacing: .25em; font-size: .7rem; vertical-align: 2px; }
.court h1 { font-size: 1.55rem; letter-spacing: .01em; text-shadow: 0 2px 0 rgb(0 0 0 / .18); }
.court .when { font-weight: 600; opacity: .95; }
.court-row { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.court .swallow { position: absolute; z-index: 0; right: -14px; bottom: -8px; width: 156px; max-width: 46%; pointer-events: none; filter: drop-shadow(0 4px 8px rgb(0 0 0 / .3)); }
.count { font-family: var(--display); font-size: 2.7rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--court-ink); }
.count small { font-size: 1.15rem; color: var(--ball); }
.count-label { font-size: .8rem; opacity: .9; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.chip-open { background: rgb(255 255 255 / .16); color: var(--court-ink); }
.chip-open::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5BF0A5; }
.chip-lock { background: var(--ball); color: var(--ball-ink); }

/* Quem é você */
.who { display: flex; align-items: center; gap: 10px; }
.who .grow { flex: 1; min-width: 0; }
.who b { font-weight: 700; }

/* Linhas de jogadores */
.list { display: grid; gap: 2px; margin: 0 -6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.row:hover { background: var(--surface-2); }
.row.on { background: var(--court-soft); }
.row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--court); flex: none; margin: 0; }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row.static { cursor: default; }
.av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: .85rem; color: #fff; object-fit: cover; }
.av.lg { width: 64px; height: 64px; font-size: 1.4rem; }
.paid { font-size: .7rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ball-ink); background: var(--ball); padding: 2px 7px; border-radius: 999px; flex: none; }
.pos { font-size: .78rem; font-weight: 700; color: var(--court); font-variant-numeric: tabular-nums; flex: none; min-width: 2.2em; text-align: right; }
.pos.wait { color: var(--warn); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h .muted { font-size: .85rem; }

/* Formulários */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .row:focus-within { outline: 2px solid var(--court); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--court); margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--court); color: var(--court-ink); }
.btn-ball { background: var(--ball); color: var(--ball-ink); }
.btn-ghost { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn-wa { background: #128C4A; color: #fff; }
.btn-ball { box-shadow: inset 0 -3px 0 rgb(0 0 0 / .14); }
.mascot { width: 120px; margin: 0 auto; display: block; }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.armed { background: var(--danger); color: #fff; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }
.link { background: none; border: 0; color: var(--link); font-weight: 700; cursor: pointer; padding: 6px 4px; }

/* Confirmados / espera */
ol.conf { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; counter-reset: c; }
ol.conf li { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
ol.conf li:last-child { border-bottom: 0; }
ol.conf li::before { counter-increment: c; content: counter(c); font-family: var(--display); color: var(--court); width: 1.8em; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
ol.conf.wait li::before { color: var(--warn); }
ol.conf .nm { flex: 1; min-width: 0; }
.by { font-size: .78rem; color: var(--muted); }
.log { display: grid; gap: 6px; font-size: .88rem; margin: 0; padding: 0; list-style: none; }
.log li { display: flex; gap: 10px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; width: 3.2em; }
.add { color: var(--ok); font-weight: 600; } .rem { color: var(--danger); font-weight: 600; }

/* Times */
.role-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.role-row:last-child { border-bottom: 0; }
.role-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tog { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 6px 10px; min-height: 36px; font-size: .8rem; font-weight: 700; cursor: pointer; }
.tog svg { width: 16px; height: 16px; }
.tog[aria-pressed=true].setter { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.tog[aria-pressed=true].late { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; }
.team header { background: var(--court); color: var(--court-ink); padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
.team:nth-child(even) header { background: var(--navy); color: var(--navy-ink); }
.team h3 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; letter-spacing: .02em; }
.team ul { list-style: none; margin: 0; padding: 8px 14px; display: grid; gap: 4px; }
.team li { display: flex; align-items: center; gap: 8px; }
.team li .tag { font-size: .72rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
.tag.s { background: var(--ok-soft); color: var(--ok); } .tag.l { background: var(--warn-soft); color: var(--warn); }
.team footer { padding: 8px 14px 12px; font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.sub { font-size: .8rem; color: var(--warn); padding-left: 24px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .86rem; font-weight: 600; }

/* Placar */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side { border-radius: 20px; padding: 14px 10px 12px; display: grid; gap: 8px; justify-items: center; text-align: center; min-width: 0; }
.side.a { background: var(--court); color: var(--court-ink); }
.side.b { background: var(--navy); color: var(--navy-ink); }
.side input { background: transparent; border: 0; border-bottom: 1px dashed currentColor; border-radius: 0; text-align: center; font-weight: 700; min-height: 36px; padding: 4px; color: inherit; }
.pts { font-family: var(--display); font-weight: 400; font-size: clamp(4.5rem, 26vw, 8rem); line-height: 1; font-variant-numeric: tabular-nums; background: none; border: 0; color: inherit; cursor: pointer; width: 100%; padding: 8px 0; border-radius: 14px; }
.pts:active { transform: scale(.97); }
.minus { background: rgb(0 0 0 / .15); color: inherit; border: 0; border-radius: 999px; min-height: 40px; min-width: 64px; font-size: 1.3rem; font-weight: 800; cursor: pointer; }
.sets { font-size: .85rem; font-weight: 700; }

/* Frequência */
.freq { display: grid; gap: 6px; }
.fbar { display: grid; grid-template-columns: minmax(0, 8.5em) 1fr 2.2em; gap: 10px; align-items: center; font-size: .9rem; }
.fbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbar .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.fbar .fill { height: 100%; background: var(--navy); border-radius: 999px; }
.fbar:nth-child(-n+3) .fill { background: var(--ball); }
.fbar b { text-align: right; font-variant-numeric: tabular-nums; }

/* Admin */
.adm-player { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.adm-player:last-child { border-bottom: 0; }
.adm-player .ctrls { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 6px; }
.adm-player select { min-height: 36px; padding: 4px 8px; }
.seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 9px; font-weight: 600; cursor: pointer; color: var(--muted); min-height: 38px; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.sug { border-left: 3px solid var(--ball); padding: 4px 0 4px 10px; display: grid; gap: 4px; }
details summary { cursor: pointer; font-weight: 700; }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: .9rem; }

/* Navegação inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .72rem; font-weight: 600; cursor: pointer; min-height: 52px; }
.tabs svg { width: 22px; height: 22px; }
.tabs button[aria-current=page] { color: var(--court); background: var(--court-soft); }

/* Folha "quem é você" e aviso */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgb(5 8 20 / .5); display: grid; align-items: end; }
.sheet-in { background: var(--surface); border-radius: 20px 20px 0 0; max-height: 82vh; overflow: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
.pick { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px 6px; border-radius: 10px; cursor: pointer; text-align: left; min-height: 48px; }
.pick:hover { background: var(--surface-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast.err { background: var(--danger); color: #fff; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); }
svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } .adm-player .ctrls { grid-template-columns: 1fr 1fr; } }
</style>

<script>
(function () {
const LG = window.VoleiLogic;
const $ = s => document.querySelector(s);
const h = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('volei:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('volei:' + k, JSON.stringify(v)); } catch (e) {} }
};
const IMG = { badge: '{{BADGE}}', glide: '{{GLIDE}}', front: '{{FRONT}}' };
const ICON = {
  hand: '<svg viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5V4.5a1.5 1.5 0 0 1 3 0V11m0-4a1.5 1.5 0 0 1 3 0v4m0-1.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4.3 14.5a1.5 1.5 0 0 1 2.5-1.6L8 14.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  wa: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.3 7.9L3 21l1.2-4.5A9 9 0 1 1 21 12Z"/><path d="M9 9.5c.3 2 1.8 3.8 4.2 4.7l1.1-1.1 1.7.7-.3 1.4c-3.3.3-7.1-3-7.2-6.4l1.4-.3.7 1.7Z"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
};

let S = null, D = null, version = null, isAdmin = false, mode = 'server', skew = 0;
let me = store.get('me', null), tab = store.get('tab', 'lista'), token = store.get('token', null);
const hostTheme = document.documentElement.getAttribute('data-theme');
const now = () => Date.now() + skew;

/* ---------- Backend: servidor de verdade, ou demonstração local ---------- */
let demo = null;
const demoPayload = () => ({ version: Date.now(), isAdmin: token === 'demo', now: Date.now(), state: LG.publicState(demo, token === 'demo') });
const Backend = {
  async load() {
    if (mode === 'demo') return demoPayload();
    const r = await fetch('api/state', { headers: token ? { 'x-admin-token': token } : {}, cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (!j || !j.state) throw new Error('resposta inválida');
    return j;
  },
  async act(a) {
    if (mode === 'demo') {
      if (a.type === 'login') return a.password === 'admin' ? { ok: true, token: 'demo' } : { ok: false, error: 'Senha incorreta. Na demonstração a senha é admin.' };
      const r = LG.apply(demo, a, { isAdmin: token === 'demo', now: Date.now() });
      if (r.ok) store.set('demoState2', demo);
      return Object.assign(r, demoPayload());
    }
    const r = await fetch('api/action', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { 'x-admin-token': token } : {}), body: JSON.stringify(a) });
    return r.json();
  }
};

function seedDemo() {
  const s = LG.initialState();
  const t = new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10);
  Object.assign(s.settings, { groupName: 'Vôlei Gran Felicitá', title: 'Jogo de quinta (exemplo)', date: t, start: '19:00', end: '22:00', max: 18 });
  const F = [['Ana', 4], ['Bia', 3], ['Carla', 2], ['Duda', 5], ['Fernanda', 3], ['Júlia', 2], ['Lara', 4], ['Marina', 3]];
  const M = [['André', 4], ['Bruno', 3], ['Caio', 5], ['Diego', 2], ['Felipe', 4], ['Gustavo', 3], ['Henrique', 2], ['Igor', 3], ['João', 5], ['Lucas', 3], ['Mateus', 4], ['Rafael', 2], ['Tiago', 3], ['Vitor', 4]];
  const add = (name, g, sk, guest) => { const id = 'd' + (s.seq++); s.players.push({ id, name, gender: g, skill: sk, paid: !guest && Math.random() < .55, guest: !!guest, photo: null, freq: guest ? 0 : Math.floor(Math.random() * 25) }); return id; };
  F.forEach(([n, k]) => add(n, 'F', k)); M.forEach(([n, k]) => add(n, 'M', k));
  const g1 = add('Pedro', 'M', 3, true), g2 = add('Sofia', 'F', 2, true);
  const ids = s.players.filter(p => !p.guest).map(p => p.id);
  const base = Date.now() - 6 * 36e5;
  ids.slice(0, 16).forEach((id, i) => s.presences.push({ pid: id, by: id, ts: base + i * 6e5 }));
  s.presences.push({ pid: g1, by: ids[3], ts: base + 17 * 6e5 }, { pid: g2, by: ids[0], ts: base + 18 * 6e5 });
  s.presences.slice().reverse().slice(0, 6).forEach(p => s.log.push({ ts: p.ts, by: p.by, act: 'add', pid: p.pid }));
  return s;
}

/* ---------- Estado ---------- */
function applyPayload(j) {
  S = j.state; isAdmin = !!j.isAdmin;
  if (j.now) skew = j.now - Date.now();
  const changed = j.version !== version; version = j.version;
  D = LG.derive(S);
  if (me && !S.players.some(p => p.id === me && !p.guest)) { me = null; store.set('me', null); }
  if (token && !isAdmin) { token = null; store.set('token', null); }
  return changed;
}
async function poll() {
  if (document.hidden) return;
  try { if (applyPayload(await Backend.load())) render(); } catch (e) {}
}
async function act(a, okMsg, clear) {
  a.by = me;
  let r;
  try { r = await Backend.act(a); } catch (e) { toast('Sem conexão. Tente de novo.', true); render(); return false; }
  if (r.token) { token = r.token; store.set('token', token); }
  if (r.state) applyPayload(r);
  else if (r.ok && a.type === 'login') { try { applyPayload(await Backend.load()); } catch (e) {} }
  if (!r.ok) { toast(r.error || 'Não deu certo.', true); render(); return false; }
  render();
  (clear || []).forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  if (okMsg) toast(okMsg);
  return true;
}

/* ---------- Utilidades de exibição ---------- */
const P = id => S.players.find(p => p.id === id);
const nameOf = p => p ? p.name + (p.guest ? ' (C)' : '') : '—';
const byName = (a, b) => a.name.localeCompare(b.name, 'pt-BR');
function hue(str) { let x = 0; for (const c of str) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
function avatar(p, lg) {
  if (!p) return '';
  if (p.photo) return `<img class="av${lg ? ' lg' : ''}" src="${h(p.photo)}" alt="">`;
  return `<span class="av${lg ? ' lg' : ''}" style="background:hsl(${hue(p.name)} 52% 44%)" aria-hidden="true">${h(p.name.trim()[0] || '?').toUpperCase()}</span>`;
}
function fmtDate(d) {
  if (!d) return '';
  try { return new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(d + 'T12:00:00Z')); } catch (e) { return d; }
}
const fmtTime = ts => new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).format(new Date(ts));
const fmtDay = ts => new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).format(new Date(ts));
const whenText = () => { const st = S.settings; return [fmtDate(st.date), st.start && st.end ? `${st.start}–${st.end}` : st.start].filter(Boolean).join(' · '); };
const locked = () => LG.lockInfo(S, now()).locked && !isAdmin;
const canEdit = () => (!!me || isAdmin) && !locked();
const opts = (list, val) => list.map(([v, t]) => `<option value="${h(v)}"${String(v) === String(val) ? ' selected' : ''}>${h(t)}</option>`).join('');
const SKILLS = [[1, '1 · começando'], [2, '2 · básico'], [3, '3 · médio'], [4, '4 · bom'], [5, '5 · muito bom']];
const GENDERS = [['F', 'Mulher'], ['M', 'Homem']];

function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }
function listText() {
  const st = S.settings;
  const lines = [`🏐 *${st.title}*`, whenText(), '', `*Confirmados ${D.confirmed.length}/${st.max}*`, ...D.confirmed.map((id, i) => `${i + 1}. ${nameOf(P(id))}${P(id).paid ? ' ✅' : ''}`)];
  if (D.waitlist.length) lines.push('', '*Lista de espera*', ...D.waitlist.map((id, i) => `${i + 1}. ${nameOf(P(id))}`));
  if (mode === 'server') lines.push('', 'Marque presença: ' + location.origin + location.pathname);
  return lines.join('\n');
}

/* ---------- Render ---------- */
function render() {
  if (!S) return;
  const keep = {};
  document.querySelectorAll('#main input[id], #main select[id], #main textarea[id]').forEach(el => { if (el.type !== 'checkbox' && el.type !== 'file') keep[el.id] = el.value; });
  const focusId = document.activeElement && document.activeElement.id;
  $('#hdr').innerHTML = renderHeader();
  $('#main').innerHTML = ({ lista: renderLista, times: renderTimes, placar: renderPlacar, freq: renderFreq, mais: renderMais }[tab] || renderLista)();
  for (const id in keep) { const el = document.getElementById(id); if (el) el.value = keep[id]; }
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus({ preventScroll: true }); }
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.title = S.settings.groupName ? `${S.settings.groupName} · Vôlei` : 'Gran Felicitá Vôlei';
}

function renderHeader() {
  const st = S.settings, lk = LG.lockInfo(S, now());
  const chip = lk.locked
    ? `<span class="chip chip-lock">Lista fechada${lk.until ? ' até ' + fmtTime(lk.until) : ''}${isAdmin ? ' · você é admin' : ''}</span>`
    : '<span class="chip chip-open">Lista aberta</span>';
  return `
    <img class="swallow" src="${IMG.glide}" alt="">
    <div class="brand"><img src="${IMG.badge}" alt="Escudo Gran Felicitá">
      <div class="grow"><span class="eyebrow">${h(st.groupName)} <span class="stars" aria-hidden="true">★★</span></span><span>${chip}</span></div></div>
    <div><h1>${h(st.title || 'Jogo')}</h1><div class="when">${h(whenText()) || '&nbsp;'}</div></div>
    <div><span class="count">${D.confirmed.length}<small>/${st.max}</small></span><br><span class="count-label">confirmados${D.waitlist.length ? ` · ${D.waitlist.length} na espera` : ''}</span></div>`;
}

function renderWho() {
  const p = me && P(me);
  if (!p) return `<div class="card who"><div class="grow"><b>Quem é você?</b><div class="hint">Escolha seu nome pra marcar presença.</div></div><button class="btn btn-primary" data-act="whoami">Escolher</button></div>`;
  const mine = S.presences.filter(x => x.by === me && x.pid !== me).length;
  return `<div class="card who">${avatar(p)}<div class="grow"><b>${h(p.name)}</b><div class="hint">Você marcou ${mine} de ${S.settings.guestLimit} pessoas além de você</div></div><button class="link" data-act="whoami">Trocar</button></div>`;
}

function renderLista() {
  const demoNote = mode === 'demo' ? '<div class="demo"><b>Demonstração.</b> Os nomes são exemplos e tudo fica só neste aparelho. A senha de admin aqui é <b>admin</b>.</div>' : '';
  const members = S.players.filter(p => !p.guest).sort(byName);
  if (!S.players.length) return demoNote + `<div class="card empty"><img class="mascot" src="${IMG.front}" alt=""><h2>Ninguém cadastrado ainda</h2><p>Quem é admin cadastra os jogadores em <b>Mais → Admin</b>.</p></div>`;
  const pos = {}; D.confirmed.forEach((id, i) => pos[id] = `<span class="pos">${i + 1}º</span>`); D.waitlist.forEach((id, i) => pos[id] = `<span class="pos wait">espera ${i + 1}</span>`);
  const edit = canEdit();
  const row = p => {
    const on = !!pos[p.id];
    return `<label class="row${on ? ' on' : ''}"><input type="checkbox" data-toggle="${p.id}"${on ? ' checked' : ''}${edit ? '' : ' disabled'} aria-label="${h(nameOf(p))}">${avatar(p)}<span class="nm">${h(nameOf(p))}</span>${p.paid ? '<span class="paid">pago</span>' : ''}${pos[p.id] || ''}</label>`;
  };
  const section = (title, list) => list.length ? `<div class="card"><div class="sec-h"><h2>${title}</h2><span class="muted">${list.filter(p => pos[p.id]).length} de ${list.length}</span></div><div class="list">${list.map(row).join('')}</div></div>` : '';
  const guests = S.players.filter(p => p.guest).sort((a, b) => (pos[b.id] ? 1 : 0) - (pos[a.id] ? 1 : 0) || byName(a, b));
  const lockMsg = locked() ? `<div class="notice">A lista está fechada agora. Só quem é admin consegue mexer.</div>` : '';
  const conf = D.ordered.slice(0, S.settings.max);
  const li = x => { const p = P(x.pid); const by = x.by && x.by !== x.pid && P(x.by) ? `<span class="by">por ${h(P(x.by).name)}</span>` : ''; return `<li>${avatar(p)}<span class="nm">${h(nameOf(p))} ${p.paid ? '<span class="paid">pago</span>' : ''}</span>${by}</li>`; };
  return `${demoNote}${renderWho()}${lockMsg}
    <p class="hint" style="padding:0 4px">Marque quem vai jogar. Quem tem <span class="paid">pago</span> contribuiu com a vaquinha e passa na frente na lista. Tirar alguém não tem limite.</p>
    ${section('Mulheres', members.filter(p => p.gender === 'F'))}
    ${section('Homens', members.filter(p => p.gender !== 'F'))}
    ${section('Convidados', guests)}
    ${edit ? `<div class="card"><h2>Trazer um convidado</h2>
      <div class="field"><label for="g-name">Nome</label><input type="text" id="g-name" maxlength="40" autocomplete="off" placeholder="Nome do convidado"></div>
      <div class="grid2"><div class="field"><label for="g-gender">Gênero</label><select id="g-gender"><option value="">Escolha</option>${opts(GENDERS)}</select></div>
      <div class="field"><label for="g-skill">Nível</label><select id="g-skill">${opts(SKILLS, 3)}</select></div></div>
      <button class="btn btn-primary" data-act="addGuest">Adicionar convidado</button></div>` : ''}
    <div class="card"><div class="sec-h"><h2>Confirmados</h2><span class="muted">${D.confirmed.length}/${S.settings.max}</span></div>
      ${conf.length ? `<ol class="conf">${conf.map(li).join('')}</ol>` : '<p class="hint">Ninguém confirmou ainda.</p>'}
      ${D.waitlist.length ? `<h3 style="font-size:1rem;color:var(--warn)">Lista de espera</h3><ol class="conf wait">${D.ordered.slice(S.settings.max).map(li).join('')}</ol>` : ''}
      <a class="btn btn-wa" href="${h(waLink(listText()))}" target="_blank" rel="noopener">${ICON.wa}Mandar lista no WhatsApp</a>
    </div>
    ${S.log.length ? `<div class="card"><h2>O que aconteceu</h2><ul class="log">${S.log.slice(0, 20).map(l => {
      const who = l.by && P(l.by) ? h(P(l.by).name) : 'Admin';
      const what = l.act === 'add' ? `<span class="add">marcou</span> ${h(nameOf(P(l.pid)))}` : l.act === 'remove' ? `<span class="rem">tirou</span> ${h(nameOf(P(l.pid)))}` : 'sorteou os times';
      return `<li><time>${fmtTime(l.ts)}</time><span>${who} ${what}</span></li>`; }).join('')}</ul></div>` : ''}`;
}

function renderTimes() {
  const conf = D.confirmed.map(P).filter(Boolean);
  const enabled = !!me || isAdmin;
  const roleRows = conf.map(p => { const r = S.roles[p.id] || {}; return `<div class="role-row">${avatar(p)}<span class="nm">${h(nameOf(p))}</span>
    <button class="tog setter" aria-pressed="${!!r.setter}" data-role="setter" data-pid="${p.id}"${enabled ? '' : ' disabled'}>${ICON.hand}Levanta</button>
    <button class="tog late" aria-pressed="${!!r.late}" data-role="late" data-pid="${p.id}"${enabled ? '' : ' disabled'}>${ICON.clock}Atrasado</button></div>`; }).join('');
  let teamsHtml = '';
  if (S.teams && S.teams.list.length) {
    const inTeams = new Set(S.teams.list.flat());
    const stale = D.confirmed.length !== inTeams.size || D.confirmed.some(id => !inTeams.has(id));
    const subs = D.waitlist.slice();
    teamsHtml = `${stale ? '<div class="notice">A lista mudou depois do sorteio. Sorteie de novo se precisar.</div>' : ''}
      <div class="teams">${S.teams.list.map((t, i) => {
        const ps = t.map(P).filter(Boolean);
        const sum = ps.reduce((a, p) => a + (Number(p.skill) || 3), 0);
        const f = ps.filter(p => p.gender === 'F').length, st = ps.filter(p => (S.roles[p.id] || {}).setter).length;
        return `<section class="team"><header><h3>Time ${i + 1}</h3><span class="small">${ps.length} jogadores</span></header><ul>${ps.map(p => {
          const r = S.roles[p.id] || {};
          const sub = r.late && subs.length ? `<li class="sub">Até chegar, entra ${h(nameOf(P(subs.shift())))}</li>` : '';
          return `<li>${avatar(p)}<span>${h(nameOf(p))}</span>${r.setter ? '<span class="tag s">levanta</span>' : ''}${r.late ? '<span class="tag l">atrasado</span>' : ''}</li>${sub}`; }).join('')}</ul>
          <footer>${ps.length - f} homens · ${f} mulheres · ${st} levantador${st === 1 ? '' : 'es'}${isAdmin ? ` · nível ${sum}` : ''}</footer></section>`; }).join('')}</div>
      <p class="hint">Sorteado às ${fmtTime(S.teams.ts)}${S.teams.by && P(S.teams.by) ? ' por ' + h(P(S.teams.by).name) : ''}.</p>
      <a class="btn btn-wa" href="${h(waLink(teamsText()))}" target="_blank" rel="noopener">${ICON.wa}Mandar times no WhatsApp</a>`;
  }
  return `<div class="card"><h2>Quem levanta e quem vai atrasar</h2>
      <p class="hint">Os levantadores ficam espalhados entre os times. Quem marcar atrasado ganha um substituto da lista de espera até chegar.</p>
      ${conf.length ? `<div>${roleRows}</div>` : '<p class="hint">Ainda não tem ninguém confirmado.</p>'}
    </div>
    <button class="btn btn-ball" data-act="draw"${conf.length >= 4 && enabled ? '' : ' disabled'} style="font-size:1.05rem">${ICON.shuffle}Sortear times</button>
    ${!enabled ? '<p class="hint">Escolha quem você é na aba Lista pra sortear.</p>' : ''}
    ${teamsHtml}`;
}
function teamsText() {
  return [`🏐 *Times — ${S.settings.title}*`, ...S.teams.list.map((t, i) => `\n*Time ${i + 1}*\n` + t.map(P).filter(Boolean).map(p => '• ' + nameOf(p) + ((S.roles[p.id] || {}).setter ? ' (levanta)' : '')).join('\n'))].join('\n');
}

let score = store.get('placar', { a: 0, b: 0, na: 'Time 1', nb: 'Time 2', sa: 0, sb: 0 });
function renderPlacar() {
  return `<div class="board">
      <div class="side a"><input type="text" id="sc-na" value="${h(score.na)}" aria-label="Nome do time da esquerda" maxlength="16"><div class="sets">sets ${score.sa}</div>
        <button class="pts" data-score="a+" aria-label="Ponto para ${h(score.na)}">${score.a}</button><button class="minus" data-score="a-" aria-label="Tirar ponto">−</button></div>
      <div class="side b"><input type="text" id="sc-nb" value="${h(score.nb)}" aria-label="Nome do time da direita" maxlength="16"><div class="sets">sets ${score.sb}</div>
        <button class="pts" data-score="b+" aria-label="Ponto para ${h(score.nb)}">${score.b}</button><button class="minus" data-score="b-" aria-label="Tirar ponto">−</button></div>
    </div>
    <p class="hint" style="text-align:center">Toque no número pra marcar ponto. O placar fica só neste celular.</p>
    <div class="btns"><button class="btn btn-ghost" data-score="set-a">Set pro ${h(score.na)}</button><button class="btn btn-ghost" data-score="set-b">Set pro ${h(score.nb)}</button></div>
    <div class="btns"><button class="btn btn-ghost" data-score="swap">Trocar lados</button><button class="btn btn-danger" data-score="reset" data-confirm>Zerar placar</button></div>`;
}

function renderFreq() {
  const list = S.players.filter(p => !p.guest || p.freq > 0).slice().sort((a, b) => (b.freq || 0) - (a.freq || 0) || byName(a, b));
  const max = Math.max(1, ...list.map(p => p.freq || 0));
  return `<div class="card"><h2>Quem mais veio</h2>
    <p class="hint">Cada jogo encerrado pelo admin soma 1 pra quem estava confirmado.</p>
    ${list.length ? `<div class="freq">${list.map(p => `<div class="fbar"><span class="nm">${h(nameOf(p))}</span><span class="track"><span class="fill" style="width:${Math.round((p.freq || 0) / max * 100)}%;display:block"></span></span><b>${p.freq || 0}</b></div>`).join('')}</div>` : '<p class="hint">Ninguém cadastrado ainda.</p>'}
  </div>`;
}

function renderMais() {
  const p = me && P(me);
  const theme = store.get('theme', 'auto');
  const st = S.settings, al = st.autoLock || {};
  let html = '';
  if (p) html += `<div class="card"><h2>Sua foto</h2><div class="who">${avatar(p, true)}<div class="grow btns">
      <label class="btn btn-ghost btn-sm" for="photo-in">Escolher foto</label><input type="file" id="photo-in" accept="image/*" hidden>
      ${p.photo ? '<button class="btn btn-ghost btn-sm" data-act="photo-del">Tirar foto</button>' : ''}</div></div></div>`;
  html += `<div class="card"><h2>Sugestões pros admins</h2>
      <div class="field"><label for="sug-text">Sua mensagem</label><textarea id="sug-text" maxlength="1000" placeholder="Ideias, reclamações, elogios…"></textarea></div>
      <div class="btns"><button class="btn btn-ghost" data-act="sug-anon">Enviar anônima</button><button class="btn btn-primary" data-act="sug-sign"${p ? '' : ' disabled'}>Enviar com meu nome</button></div></div>
    <div class="card"><h2>Tema</h2><div class="seg" role="group" aria-label="Tema">
      ${[['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([v, t]) => `<button data-theme-set="${v}" aria-pressed="${theme === v}">${t}</button>`).join('')}</div></div>
    <div class="card"><details><summary>Como a lista funciona</summary><ul class="rules" style="margin-top:10px">
      <li>Cada pessoa marca a si mesma e até ${st.guestLimit} outras pessoas (incluindo convidados). Tirar não tem limite.</li>
      <li>Quem pagou a vaquinha passa na frente; depois vale a ordem de chegada.</li>
      <li>Entram ${st.max} confirmados; o resto fica na lista de espera e sobe sozinho se alguém sair.</li>
      <li>O sorteio equilibra homens, mulheres, levantadores e nível.</li>
      ${al.enabled ? `<li>Toda ${LG.DAYS[al.day].toLowerCase()}, das ${h(al.from)} às ${h(al.to)}, a lista fica fechada.</li>` : ''}
    </ul></details></div>`;

  if (!isAdmin) {
    html += `<div class="card"><h2>Admin</h2><div class="field"><label for="adm-pw">Senha</label><input type="password" id="adm-pw" autocomplete="current-password"></div>
      <button class="btn btn-ghost" data-act="login">Entrar como admin</button></div>`;
    return html;
  }
  const players = S.players.slice().sort((a, b) => (a.guest ? 1 : 0) - (b.guest ? 1 : 0) || byName(a, b));
  const lk = LG.lockInfo(S, now());
  html += `<div class="card"><div class="sec-h"><h2>Admin · Jogo</h2><button class="link" data-act="logout">Sair do admin</button></div>
      <div class="field"><label for="s-group">Nome do grupo</label><input type="text" id="s-group" value="${h(st.groupName)}"></div>
      <div class="field"><label for="s-title">Título do jogo</label><input type="text" id="s-title" value="${h(st.title)}"></div>
      <div class="grid3"><div class="field"><label for="s-date">Data</label><input type="date" id="s-date" value="${h(st.date)}"></div>
        <div class="field"><label for="s-start">Começa</label><input type="time" id="s-start" value="${h(st.start)}"></div>
        <div class="field"><label for="s-end">Termina</label><input type="time" id="s-end" value="${h(st.end)}"></div></div>
      <div class="grid3"><div class="field"><label for="s-max">Vagas</label><input type="number" id="s-max" min="4" max="60" value="${st.max}"></div>
        <div class="field"><label for="s-per">Por time</label><input type="number" id="s-per" min="2" max="9" value="${st.perTeam}"></div>
        <div class="field"><label for="s-limit">Pode marcar</label><input type="number" id="s-limit" min="0" max="10" value="${st.guestLimit}"></div></div>
      <button class="btn btn-primary" data-act="save-settings">Salvar jogo</button></div>

    <div class="card"><h2>Admin · Jogadores</h2>
      <div class="field"><label for="np-name">Novo jogador</label><input type="text" id="np-name" maxlength="40" placeholder="Nome"></div>
      <div class="grid2"><div class="field"><label for="np-gender">Gênero</label><select id="np-gender"><option value="">Escolha</option>${opts(GENDERS)}</select></div>
        <div class="field"><label for="np-skill">Nível</label><select id="np-skill">${opts(SKILLS, 3)}</select></div></div>
      <label class="check"><input type="checkbox" id="np-paid"> Pagou a vaquinha</label>
      <button class="btn btn-primary" data-act="add-player">Cadastrar</button>
      <div>${players.map(q => `<div class="adm-player">${avatar(q)}<b>${h(nameOf(q))}</b>
        <div class="ctrls"><select data-edit="${q.id}" data-field="gender" aria-label="Gênero de ${h(q.name)}">${opts(GENDERS, q.gender)}</select>
          <select data-edit="${q.id}" data-field="skill" aria-label="Nível de ${h(q.name)}">${opts(SKILLS, q.skill)}</select>
          <button class="tog setter" aria-pressed="${!!q.paid}" data-paid="${q.id}">pago</button>
          <button class="btn btn-danger btn-sm" data-del="${q.id}" data-confirm>Excluir</button></div></div>`).join('')}</div></div>

    <div class="card"><h2>Admin · Fechar a lista</h2>
      <p class="hint">${lk.locked ? (lk.reason === 'manual' ? `Fechada até ${fmtDay(lk.until)}.` : 'Fechada pelo horário automático.') : 'A lista está aberta.'}</p>
      <div class="grid2"><div class="field"><label for="lk-min">Fechar por (minutos)</label><input type="number" id="lk-min" min="1" value="60"></div>
        <div class="btns" style="align-items:end"><button class="btn btn-ghost" data-act="lock">Fechar</button><button class="btn btn-ghost" data-act="unlock"${st.manualLockUntil > now() ? '' : ' disabled'}>Reabrir</button></div></div>
      <label class="check"><input type="checkbox" id="al-on"${al.enabled ? ' checked' : ''}> Fechar toda semana num horário</label>
      <div class="grid3"><div class="field"><label for="al-day">Dia</label><select id="al-day">${opts(LG.DAYS.map((d, i) => [i, d]), al.day)}</select></div>
        <div class="field"><label for="al-from">Das</label><input type="time" id="al-from" value="${h(al.from)}"></div>
        <div class="field"><label for="al-to">Até</label><input type="time" id="al-to" value="${h(al.to)}"></div></div>
      <button class="btn btn-ghost" data-act="save-autolock">Salvar horário</button></div>

    <div class="card"><h2>Admin · Fim de jogo</h2>
      <p class="hint"><b>Encerrar jogo</b> soma 1 na frequência de quem estava confirmado e limpa a lista, os papéis, os times e o histórico.</p>
      <button class="btn btn-danger" data-act="resetPresences" data-confirm>Encerrar jogo e limpar lista</button>
      <div class="btns"><button class="btn btn-danger" data-act="resetPaid" data-confirm>Zerar pagamentos</button><button class="btn btn-danger" data-act="resetFreq" data-confirm>Zerar frequência</button></div></div>

    <div class="card"><h2>Admin · Sugestões recebidas</h2>
      ${S.suggestions.length ? S.suggestions.map(x => `<div class="sug"><div>${h(x.text)}</div><div class="by">${x.by && P(x.by) ? h(P(x.by).name) : 'Anônima'} · ${fmtDay(x.ts)} · <button class="link" data-sugdel="${x.id}">apagar</button></div></div>`).join('') : '<p class="hint">Nenhuma sugestão por enquanto.</p>'}</div>`;
  return html;
}

/* ---------- Folha "quem é você" ---------- */
function openWho() {
  const list = S.players.filter(p => !p.guest).sort(byName);
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-in" role="dialog" aria-modal="true" aria-label="Quem é você?"><div class="sec-h"><h2>Quem é você?</h2><button class="link" data-act="close-sheet">Fechar</button></div>
    <input type="text" id="who-q" placeholder="Buscar nome" autocomplete="off">
    <div id="who-list">${list.map(p => `<button class="pick" data-pick="${p.id}" data-n="${h(p.name.toLowerCase())}">${avatar(p)}<span>${h(p.name)}</span></button>`).join('')}</div>
    <p class="hint">Não achou seu nome? Peça pra um admin te cadastrar.</p></div>`;
  sh.hidden = false;
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }

/* ---------- Eventos ---------- */
let toastTimer;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 4000 : 2200); }
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };

function armed(btn) {
  if (!btn.hasAttribute('data-confirm') || btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = 'Toque de novo pra confirmar'; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.label; btn.classList.remove('armed'); } }, 4000);
  return false;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button, a');
  if (!t) { if (e.target.id === 'sheet') closeSheet(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; store.set('tab', tab); render(); window.scrollTo(0, 0); return; }
  if (!armed(t)) return;
  if (t.dataset.pick) { me = t.dataset.pick; store.set('me', me); closeSheet(); render(); toast('Oi, ' + P(me).name + '!'); return; }
  if (t.dataset.role) return act({ type: 'role', pid: t.dataset.pid, role: t.dataset.role });
  if (t.dataset.paid) return act({ type: 'togglePaid', id: t.dataset.paid });
  if (t.dataset.del) return act({ type: 'deletePlayer', id: t.dataset.del }, 'Jogador excluído.');
  if (t.dataset.sugdel) return act({ type: 'deleteSuggestion', id: t.dataset.sugdel });
  if (t.dataset.themeSet) { store.set('theme', t.dataset.themeSet); applyTheme(); render(); return; }
  if (t.dataset.score) return scoreAct(t.dataset.score);
  switch (t.dataset.act) {
    case 'whoami': return openWho();
    case 'close-sheet': return closeSheet();
    case 'addGuest': return act({ type: 'addGuest', name: val('g-name'), gender: val('g-gender'), skill: val('g-skill') }, 'Convidado adicionado.', ['g-name']);
    case 'draw': return act({ type: 'draw' }, 'Times sorteados!');
    case 'photo-del': return act({ type: 'photo', pid: me, photo: null }, 'Foto removida.');
    case 'sug-anon': return act({ type: 'suggest', text: val('sug-text'), anon: true }, 'Sugestão enviada. Obrigado!', ['sug-text']);
    case 'sug-sign': return act({ type: 'suggest', text: val('sug-text'), anon: false }, 'Sugestão enviada. Obrigado!', ['sug-text']);
    case 'login': return act({ type: 'login', password: val('adm-pw') }, 'Você entrou como admin.', ['adm-pw']);
    case 'logout': token = null; store.set('token', null); isAdmin = false; await poll(); render(); return;
    case 'save-settings': return act({ type: 'settings', groupName: val('s-group'), title: val('s-title'), date: val('s-date'), start: val('s-start'), end: val('s-end'), max: val('s-max'), perTeam: val('s-per'), guestLimit: val('s-limit') }, 'Jogo salvo.');
    case 'add-player': return act({ type: 'savePlayer', name: val('np-name'), gender: val('np-gender'), skill: val('np-skill'), paid: document.getElementById('np-paid').checked }, 'Jogador cadastrado.', ['np-name']);
    case 'lock': return act({ type: 'lockNow', minutes: val('lk-min') }, 'Lista fechada.');
    case 'unlock': return act({ type: 'unlock' }, 'Lista reaberta.');
    case 'save-autolock': return act({ type: 'autoLock', enabled: document.getElementById('al-on').checked, day: val('al-day'), from: val('al-from'), to: val('al-to') }, 'Horário salvo.');
    case 'resetPresences': return act({ type: 'resetPresences' }, 'Jogo encerrado. Frequência atualizada.');
    case 'resetPaid': return act({ type: 'resetPaid' }, 'Pagamentos zerados.');
    case 'resetFreq': return act({ type: 'resetFreq' }, 'Frequência zerada.');
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.toggle) return act({ type: t.checked ? 'join' : 'leave', pid: t.dataset.toggle });
  if (t.dataset.edit) { const q = P(t.dataset.edit); if (!q) return; return act(Object.assign({ type: 'savePlayer' }, q, { [t.dataset.field]: t.value }), 'Salvo.'); }
  if (t.id === 'photo-in' && t.files && t.files[0]) return uploadPhoto(t.files[0]);
  if (t.id === 'sc-na' || t.id === 'sc-nb') { score[t.id === 'sc-na' ? 'na' : 'nb'] = t.value.trim() || (t.id === 'sc-na' ? 'Time 1' : 'Time 2'); store.set('placar', score); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'who-q') return;
  const q = e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  document.querySelectorAll('#who-list .pick').forEach(b => { b.hidden = !b.dataset.n.normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function scoreAct(k) {
  if (k === 'a+') score.a++; else if (k === 'b+') score.b++;
  else if (k === 'a-') score.a = Math.max(0, score.a - 1); else if (k === 'b-') score.b = Math.max(0, score.b - 1);
  else if (k === 'set-a') { score.sa++; score.a = 0; score.b = 0; } else if (k === 'set-b') { score.sb++; score.a = 0; score.b = 0; }
  else if (k === 'swap') score = { a: score.b, b: score.a, na: score.nb, nb: score.na, sa: score.sb, sb: score.sa };
  else if (k === 'reset') score = { a: 0, b: 0, na: score.na, nb: score.nb, sa: 0, sb: 0 };
  store.set('placar', score); render();
}

function uploadPhoto(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const c = document.createElement('canvas'), n = 160; c.width = c.height = n;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
    URL.revokeObjectURL(url);
    act({ type: 'photo', pid: me, photo: c.toDataURL('image/jpeg', 0.82) }, 'Foto atualizada.');
  };
  img.onerror = () => toast('Não consegui abrir essa imagem.', true);
  img.src = url;
}

function applyTheme() {
  const t = store.get('theme', 'auto'), root = document.documentElement;
  if (t === 'auto') { if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', t);
}

async function boot() {
  applyTheme();
  try { applyPayload(await Backend.load()); }
  catch (e) { mode = 'demo'; demo = store.get('demoState2', null) || seedDemo(); store.set('demoState2', demo); applyPayload(demoPayload()); }
  render();
  if (mode === 'server') { setInterval(poll, 8000); document.addEventListener('visibilitychange', poll); }
  setInterval(() => { if (S) { const lk = JSON.stringify(LG.lockInfo(S, now())); if (lk !== boot.lk) { boot.lk = lk; render(); } } }, 30000);
}
boot();
})();
</script>
