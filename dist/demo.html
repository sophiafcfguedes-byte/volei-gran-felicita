<style>
/* Identidade Gran Felicitá: grená #940B29, dourado #D2A95A, marinho #2E4670, cinza #6F6F6F, gelo #F1F1F1.
   Layout: coluna única de celular; cabeçalho grená com o escudo e a andorinha; navegação fixa embaixo. */
:root {
  --bg: #F1F1F1; --surface: #FFFFFF; --surface-2: #F6F6F7; --ink: #1B2640; --muted: #5F6472; --line: #E0E0E3;
  --court: #940B29; --court-deep: #6E061D; --court-ink: #FFFFFF; --court-soft: #F7E4E8;
  --navy: #2E4670; --navy-ink: #FFFFFF; --link: #2E4670;
  --ball: #D2A95A; --ball-ink: #2A1D05; --ball-soft: #F6ECD8;
  --ok: #1E7A4C; --ok-soft: #DDF1E6; --warn: #9A5A06; --warn-soft: #FBEBD2; --danger: #B3122F; --danger-soft: #FBE1E5;
  --shadow: 0 1px 2px rgb(27 38 64 / .06), 0 6px 20px rgb(27 38 64 / .05);
  --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --serif: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1322; --surface: #161E33; --surface-2: #1C2640; --ink: #EEF0F5; --muted: #A3A9B8; --line: #2A3450;
  --court: #B81538; --court-deep: #7A0820; --court-ink: #FFFFFF; --court-soft: #3A1420;
  --navy: #3D5A8C; --navy-ink: #FFFFFF; --link: #9DB6E4;
  --ball: #DDB66A; --ball-ink: #2A1D05; --ball-soft: #3A2F18;
  --ok: #4CC98A; --ok-soft: #133326; --warn: #EBAB55; --warn-soft: #3A2A12; --danger: #FF6F86; --danger-soft: #3D1520;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1322; --surface: #161E33; --surface-2: #1C2640; --ink: #EEF0F5; --muted: #A3A9B8; --line: #2A3450;
  --court: #B81538; --court-deep: #7A0820; --court-ink: #FFFFFF; --court-soft: #3A1420;
  --navy: #3D5A8C; --navy-ink: #FFFFFF; --link: #9DB6E4;
  --ball: #DDB66A; --ball-ink: #2A1D05; --ball-soft: #3A2F18;
  --ok: #4CC98A; --ok-soft: #133326; --warn: #EBAB55; --warn-soft: #3A2A12; --danger: #FF6F86; --danger-soft: #3D1520;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-family: var(--display); font-weight: 400; }
h2 { font-family: var(--body); font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-family: var(--body); font-weight: 800; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
main { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hint { font-size: .88rem; color: var(--muted); margin: 0; }
.demo { background: var(--ball-soft); color: var(--ink); border: 1px dashed var(--ball); border-radius: 12px; padding: 10px 12px; font-size: .86rem; }

/* Cabeçalho grená com escudo, estrelas douradas e a andorinha */
.court { position: relative; overflow: hidden; border-radius: 22px; color: var(--court-ink); padding: 16px 16px 18px;
  background:
    radial-gradient(120% 90% at 100% 100%, rgb(46 70 112 / .55), transparent 60%),
    linear-gradient(165deg, var(--court), var(--court-deep));
  display: grid; gap: 12px; box-shadow: inset 0 0 0 1.5px rgb(210 169 90 / .55); }
.court::after { content: ""; position: absolute; inset: 7px; border: 1px solid rgb(255 255 255 / .16); border-radius: 16px; pointer-events: none; }
.court > * { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 62px; height: 62px; flex: none; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .35)); }
.brand .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }
.eyebrow { font-family: var(--serif); font-size: .92rem; letter-spacing: .08em; font-weight: 700; color: var(--ball); line-height: 1.1; }
.eyebrow .stars { letter-spacing: .25em; font-size: .7rem; vertical-align: 2px; }
.court h1 { font-size: 1.55rem; letter-spacing: .01em; text-shadow: 0 2px 0 rgb(0 0 0 / .18); }
.court .when { font-weight: 600; opacity: .95; }
.court-row { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.court .swallow { position: absolute; z-index: 0; right: -14px; bottom: -8px; width: 156px; max-width: 46%; pointer-events: none; filter: drop-shadow(0 4px 8px rgb(0 0 0 / .3)); }
.count { font-family: var(--display); font-size: 2.7rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--court-ink); }
.count small { font-size: 1.15rem; color: var(--ball); }
.count-label { font-size: .8rem; opacity: .9; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.chip-open { background: rgb(255 255 255 / .16); color: var(--court-ink); }
.chip-open::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5BF0A5; }
.chip-lock { background: var(--ball); color: var(--ball-ink); }

/* Quem é você */
.who { display: flex; align-items: center; gap: 10px; }
.who .grow { flex: 1; min-width: 0; }
.who b { font-weight: 700; }

/* Linhas de jogadores */
.list { display: grid; gap: 2px; margin: 0 -6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.row:hover { background: var(--surface-2); }
.row.on { background: var(--court-soft); }
.row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--court); flex: none; margin: 0; }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row.static { cursor: default; }
.av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: .85rem; color: #fff; object-fit: cover; }
.av.lg { width: 64px; height: 64px; font-size: 1.4rem; }
.paid { font-size: .7rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ball-ink); background: var(--ball); padding: 2px 7px; border-radius: 999px; flex: none; }
.pos { font-size: .78rem; font-weight: 700; color: var(--court); font-variant-numeric: tabular-nums; flex: none; min-width: 2.2em; text-align: right; }
.pos.wait { color: var(--warn); }
.pos.fx { color: var(--ball-ink); background: var(--ball-soft); border: 1px solid var(--ball); border-radius: 999px; padding: 1px 8px; font-size: .72rem; min-width: 0; }
.opens { grid-template-columns: auto 1fr; align-items: center; background: var(--ball-soft); border-color: var(--ball); }
.mascot.sm { width: 64px; margin: 0; }
.sched { display: grid; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
/* Folhinha de calendário no cabeçalho */
.game { display: flex; align-items: center; gap: 14px; }
.game-t { min-width: 0; display: grid; gap: 4px; }
.cal { position: relative; flex: none; width: 74px; display: grid; justify-items: center; background: #FFFFFF; color: #2E4670; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 0 rgb(0 0 0 / .18), 0 6px 14px rgb(0 0 0 / .22); padding-bottom: 6px; }
.cal::before, .cal::after { content: ""; position: absolute; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: rgb(0 0 0 / .28); }
.cal::before { left: 18px; } .cal::after { right: 18px; }
.cal-m { width: 100%; text-align: center; background: #D2A95A; color: #2A1D05; font-family: var(--serif); font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; padding: 12px 0 3px; }
.cal-d { font-family: var(--display); font-size: 2.15rem; line-height: 1.05; padding-top: 2px; font-variant-numeric: tabular-nums; }
.cal-w { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #940B29; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h .muted { font-size: .85rem; }

/* Formulários */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=search], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .row:focus-within { outline: 2px solid var(--court); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--court); margin: 0; }

<script>
/* Regras do app Vôlei Gran Felicitá — usado pelo servidor (Netlify/Node) e pelo navegador (modo demo).
   Cada dia de jogo configurado tem a sua própria lista. Jogos "fechados" só aparecem
   para quem tem a bolinha (player.priv). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VoleiLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const DAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const DAYS_SHORT = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const SETTINGS_VERSION = 5;
  const ADMIN_ONLY = new Set([
    'bulkAdd', 'savePlayer', 'deletePlayer', 'togglePaid', 'toggleFixed', 'togglePriv', 'settings', 'schedule',
    'lockNow', 'unlock', 'resetFreq', 'resetPaid', 'deleteSuggestion'
  ]);
  const GAME_ACTIONS = new Set(['join', 'leave', 'addGuest', 'draw', 'role', 'resetPresences']);

  const WED = { day: 3, start: '19:00', end: '22:00', openDay: 2, openTime: '12:00', max: 15, teams: 2, private: true, fixed: false, guests: false };
  function defaultSettings() {
    return {
      v: SETTINGS_VERSION,
      groupName: 'Vôlei Gran Felicitá',
      guestLimit: 3, paidPriority: false,
      schedule: [
        { day: 1, start: '19:00', end: '22:00', openDay: 0, openTime: '12:00', max: 24, teams: 4, private: false, fixed: true, guests: true },
        Object.assign({}, WED),
        { day: 4, start: '19:00', end: '22:00', openDay: 3, openTime: '12:00', max: 24, teams: 4, private: false, fixed: true, guests: true }
      ],
      manualLockUntil: 0
    };
  }

  function initialState() {
    return { settings: defaultSettings(), players: [], games: {}, suggestions: [], history: [], seq: 1 };
  }

  function newId(s, prefix) {
    s.seq = (s.seq || 1) + 1;
    return (prefix || 'p') + s.seq.toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ---------- Datas no horário de Brasília (UTC−3, sem horário de verão) ---------- */
  const SP = -3 * 3600e3;
  const toMins = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  const spParts = ts => { const d = new Date(ts + SP); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), wd: d.getUTCDay() }; };
  const spTs = (y, m, d, hhmm) => Date.UTC(y, m, d, 0, toMins(hhmm)) - SP;
  const isoDate = (y, m, d) => new Date(Date.UTC(y, m, d)).toISOString().slice(0, 10);

  /* A próxima data de cada dia de jogo que ainda não terminou. */
  function activeGames(s, now) {
    const t = spParts(now), out = [];
    for (const g of s.settings.schedule || []) {
      for (let k = 0; k <= 7; k++) {
        const base = new Date(Date.UTC(t.y, t.m, t.d + k));
        const y = base.getUTCFullYear(), m = base.getUTCMonth(), d = base.getUTCDate();
        if (base.getUTCDay() !== g.day) continue;
        const startAt = spTs(y, m, d, g.start), endAt = spTs(y, m, d, g.end);
        if (endAt <= now) continue;
        const before = ((g.day - g.openDay) % 7 + 7) % 7;
        out.push({
          id: isoDate(y, m, d), day: g.day, start: g.start, end: g.end, startAt, endAt,
          openAt: spTs(y, m, d - before, g.openTime), openDay: g.openDay, openTime: g.openTime,
          max: Number(g.max) || 24, teams: Number(g.teams) || 4, private: !!g.private, fixed: g.fixed !== false, guests: g.guests !== undefined ? !!g.guests : !g.private
        });
        break;
      }
    }
    return out.sort((a, b) => a.startAt - b.startAt);
  }

  function gameTitle(g) { return g ? `Vôlei de ${DAYS[g.day].toLowerCase()}` : 'Sem jogo marcado'; }
  function gameWhen(g) {
    if (!g) return '';
    const p = spParts(g.startAt);
    return `${DAYS_SHORT[g.day]}, ${p.d} de ${MONTHS[p.m]} · ${g.start}–${g.end}`;
  }

  const emptyGame = meta => ({ meta, presences: [], out: [], roles: {}, teams: null, log: [] });

  /* Uma "visão" de um jogo no formato que as regras usam. Os arrays são os do jogo. */
  function view(s, id) {
    const g = s.games[id];
    if (!g) return null;
    return {
      settings: Object.assign({}, s.settings, { max: g.meta.max, teams: g.meta.teams }),
      players: s.players, current: g.meta,
      presences: g.presences, out: g.out, roles: g.roles, teams: g.teams, log: g.log
    };
  }
  function writeBack(s, id, v) {
    const g = s.games[id];
    g.presences = v.presences; g.out = v.out; g.roles = v.roles; g.teams = v.teams; g.log = v.log;
  }

  /* Ajusta estados antigos, fecha jogos que já acabaram (+1 na frequência
     de quem estava confirmado) e abre a lista dos próximos. */
  function normalize(s, now) {
    const init = initialState();
    for (const k of Object.keys(init)) if (s[k] === undefined) s[k] = init[k];
    const st = s.settings || {};
    if (!st.v || st.v < 3) {
      const fresh = defaultSettings();
      if (Array.isArray(st.schedule) && st.schedule.length) {
        fresh.schedule = st.schedule.map(g => Object.assign({ max: Number(st.max) || 24, teams: Number(st.teams) || 4, private: false, fixed: true }, g));
        if (!fresh.schedule.some(g => g.day === 3)) fresh.schedule.push(Object.assign({}, WED));
        fresh.schedule.sort((a, b) => a.day - b.day);
      }
      fresh.groupName = st.groupName || fresh.groupName;
      if (st.guestLimit != null) fresh.guestLimit = st.guestLimit;
      fresh.paidPriority = !!st.paidPriority;
      s.settings = fresh;
      if (s.current && s.current.id) {
        const meta = Object.assign({ max: Number(st.max) || 24, teams: Number(st.teams) || 4, private: false, fixed: true }, s.current);
        s.games[s.current.id] = { meta, presences: s.presences || [], out: s.out || [], roles: s.roles || {}, teams: s.teams || null, log: s.log || [] };
      }
      ['current', 'presences', 'out', 'roles', 'teams', 'log'].forEach(k => delete s[k]);
    }
    if (s.settings.v === 3) {
      /* v4: quarta passa a ter 2 times (8 e 7). */
      s.settings.schedule.forEach(g => { if (g.day === 3 && g.private && Number(g.teams) === 3) g.teams = 2; });
      for (const g of Object.values(s.games)) if (g.meta && g.meta.day === 3 && g.meta.private && g.meta.teams === 3) g.meta.teams = 2;
    }
    if (s.settings.v < 5) {
      /* v5: convidado só nos jogos abertos (segunda e quinta). */
      s.settings.schedule.forEach(g => { if (g.guests === undefined) g.guests = !g.private; });
    }
    s.settings.v = SETTINGS_VERSION;
    const act = activeGames(s, now);
    const ids = new Set(act.map(g => g.id));
    for (const id of Object.keys(s.games)) {
      if (ids.has(id)) continue;
      const g = s.games[id];
      if (g.meta && now >= g.meta.endAt) finishGame(s, id);
      delete s.games[id];
    }
    for (const meta of act) {
      if (!s.games[meta.id]) s.games[meta.id] = emptyGame(meta);
      else s.games[meta.id].meta = meta;
    }
    return s;
  }

  function finishGame(s, id) {
    const v = view(s, id);
    if (!v) return;
    const d = derive(v);
    const pm = playerMap(s);
    d.confirmed.forEach(pid => { if (pm[pid]) pm[pid].freq = (pm[pid].freq || 0) + 1; });
    s.history.unshift({ id, confirmed: d.confirmed });
    if (s.history.length > 90) s.history.length = 90;
  }

  function lockInfo(v, now) {
    const g = v && v.current;
    if (!g) return { locked: true, reason: 'noGame' };
    if (v.settings.manualLockUntil && v.settings.manualLockUntil > now) return { locked: true, reason: 'manual', until: v.settings.manualLockUntil };
    if (now < g.openAt) return { locked: true, reason: 'notOpen', opensAt: g.openAt };
    return { locked: false };
  }

  const playerMap = s => Object.fromEntries(s.players.map(p => [p.id, p]));
  const canSee = (meta, p) => !meta.private || !!(p && p.priv);

  /* Comissão (vaga garantida, se o jogo tiver) entra primeiro; o resto por ordem de
     check-in (ou quem pagou a vaquinha primeiro, se essa opção estiver ligada). */
  function derive(v) {
    if (!v || !v.current) return { fixed: [], ordered: [], open: 0, regular: [], confirmed: [], waitlist: [] };
    const meta = v.current, pm = playerMap(v);
    const outSet = new Set(v.out || []);
    const isFixedHere = p => meta.fixed && p.fixed && canSee(meta, p);
    const fixed = v.players.filter(p => isFixedHere(p) && !outSet.has(p.id)).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR')).map(p => p.id);
    const prio = !!v.settings.paidPriority;
    const ordered = v.presences.filter(x => pm[x.pid] && !isFixedHere(pm[x.pid])).slice()
      .sort((a, b) => (prio ? (pm[b.pid].paid ? 1 : 0) - (pm[a.pid].paid ? 1 : 0) : 0) || a.ts - b.ts);
    const open = Math.max(0, (Number(meta.max) || 24) - fixed.length);
    return {
      fixed, ordered, open,
      regular: ordered.slice(0, open).map(x => x.pid),
      confirmed: fixed.concat(ordered.slice(0, open).map(x => x.pid)),
      waitlist: ordered.slice(open).map(x => x.pid)
    };
  }

  function shuffle(arr, rand) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  /* Times equilibrados: espalha mulheres e homens pelo nível, sempre no time com
     menos daquele tipo e menor soma; depois troca pares do mesmo gênero enquanto
     a diferença de nível entre os times cair. */
  function drawTeams(v, ids, rand) {
    rand = rand || Math.random;
    const pm = playerMap(v);
    const n = ids.length;
    const k = Math.max(2, Math.min(Math.floor(n / 2), Number(v.settings.teams) || 4));
    const cap = Math.ceil(n / k);
    const P = shuffle(ids.map(id => {
      const p = pm[id], r = v.roles[id] || {};
      return { id, g: p.gender === 'F' ? 'F' : 'M', sk: Number(p.skill) || 3, st: !!r.setter };
    }), rand);
    const bySkill = arr => arr.sort((a, b) => b.sk - a.sk);
    const order = [
      ...bySkill(P.filter(x => x.st)),
      ...bySkill(P.filter(x => !x.st && x.g === 'F')),
      ...bySkill(P.filter(x => !x.st && x.g === 'M'))
    ];
    const T = Array.from({ length: k }, () => ({ m: [], sum: 0, st: 0, f: 0 }));
    for (const x of order) {
      const open = T.filter(t => t.m.length < cap);
      const key = t => [x.st ? t.st : x.g === 'F' ? t.f : 0, t.sum, t.m.length];
      open.sort((a, b) => { const ka = key(a), kb = key(b); for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i]; return rand() - 0.5; });
      const t = open[0];
      t.m.push(x); t.sum += x.sk; if (x.st) t.st++; if (x.g === 'F') t.f++;
    }
    const spread = () => { const vals = T.map(t => t.sum); return Math.max(...vals) - Math.min(...vals); };
    for (let it = 0; it < 600; it++) {
      const a = T[Math.floor(rand() * k)], b = T[Math.floor(rand() * k)];
      if (a === b || !a.m.length || !b.m.length) continue;
      const i = Math.floor(rand() * a.m.length), x = a.m[i];
      const j = b.m.findIndex(y => y.g === x.g && y.st === x.st && y.sk !== x.sk);
      if (j < 0) continue;
      const y = b.m[j], before = spread();
      a.sum += y.sk - x.sk; b.sum += x.sk - y.sk;
      if (spread() < before) { a.m[i] = y; b.m[j] = x; } else { a.sum -= y.sk - x.sk; b.sum -= x.sk - y.sk; }
    }
    return T.map(t => t.m.map(x => x.id));
  }

  const cleanName = v => String(v || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  const clampSkill = v => Math.min(5, Math.max(1, Math.round(Number(v) || 3)));
  const cleanTime = v => /^\d{2}:\d{2}$/.test(String(v)) ? String(v) : null;

  function apply(s, a, ctx) {
    const now = ctx.now, admin = !!ctx.isAdmin;
    normalize(s, now);
    const fail = error => ({ ok: false, error });
    const ok = { ok: true };
    const pm = playerMap(s);
    const me = a.by ? pm[a.by] : null;
    const limit = Number(s.settings.guestLimit) || 0;

    if (ADMIN_ONLY.has(a.type) && !admin) return fail('Só quem é admin pode fazer isso.');
    if (!ADMIN_ONLY.has(a.type) && !me && !admin && a.type !== 'suggest' && a.type !== 'register') return fail('Escolha quem você é antes (no topo da lista).');

    /* ---------- ações de um jogo ---------- */
    if (GAME_ACTIONS.has(a.type)) {
      const v = view(s, a.game);
      if (!v) return fail('Esse jogo não está mais aberto. Recarregue a página.');
      const meta = v.current;
      if (meta.private && !admin && !canSee(meta, me)) return fail('Esse jogo é só pra quem foi liberado.');
      const r = gameAction(s, v, a, { now, admin, me, limit, pm, rand: ctx.rand });
      writeBack(s, a.game, v);
      return r;
    }

    switch (a.type) {
      case 'register': {
        const name = cleanName(a.name);
        if (name.length < 2) return fail('Escreva seu nome.');
        if (a.gender !== 'F' && a.gender !== 'M') return fail('Escolha seu gênero.');
        if (s.players.filter(x => !x.guest).length >= 300) return fail('O grupo chegou no limite de cadastros. Fale com um admin.');
        let p = s.players.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (p && !p.guest) return fail(`Já tem alguém chamado ${p.name}. Procure na lista, ou use um sobrenome.`);
        if (p) { p.guest = false; p.gender = a.gender; }
        else { p = { id: newId(s, 'p'), name, gender: a.gender, skill: 3, paid: false, guest: false, fixed: false, priv: false, photo: null, freq: 0 }; s.players.push(p); }
        return { ok: true, id: p.id };
      }
      case 'photo': {
        if (!admin && a.pid !== a.by) return fail('Você só pode trocar a sua própria foto.');
        const p = pm[a.pid];
        if (!p) return fail('Jogador não encontrado.');
        if (a.photo !== null && !(typeof a.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(a.photo) && a.photo.length < 150000))
          return fail('Foto inválida ou grande demais.');
        p.photo = a.photo;
        return ok;
      }
      case 'suggest': {
        const text = String(a.text || '').trim().slice(0, 1000);
        if (text.length < 3) return fail('Escreva sua sugestão.');
        s.suggestions.unshift({ id: newId(s, 's'), ts: now, text, by: a.anon || !me ? null : me.id });
        if (s.suggestions.length > 200) s.suggestions.length = 200;
        return ok;
      }

      /* ---------- admin ---------- */
      case 'bulkAdd': {
        if (a.gender !== 'F' && a.gender !== 'M') return fail('Escolha o gênero de quem está na lista.');
        const lines = String(a.text || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean).slice(0, 200);
        if (!lines.length) return fail('Cole pelo menos um nome.');
        let added = 0, skipped = 0;
        for (const line of lines) {
          const m = line.replace(/^[-•*\d.)\s]+(?=\D)/, '').match(/^(.*?)(?:\s+([1-5]))?$/);
          const name = cleanName(m ? m[1] : line);
          if (name.length < 2) continue;
          if (s.players.some(x => x.name.toLowerCase() === name.toLowerCase())) { skipped++; continue; }
          s.players.push({ id: newId(s, 'p'), name, gender: a.gender, skill: m && m[2] ? Number(m[2]) : 3, paid: false, guest: false, fixed: false, priv: !!a.priv, photo: null, freq: 0 });
          added++;
        }
        return { ok: true, added, skipped };
      }
      case 'savePlayer': {
        const name = cleanName(a.name);
        if (name.length < 2) return fail('Escreva o nome.');
        if (a.gender !== 'F' && a.gender !== 'M') return fail('Escolha o gênero.');
        const dup = s.players.find(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== a.id);
        if (dup) return fail(`Já existe alguém chamado ${dup.name}.`);
        let p = a.id ? pm[a.id] : null;
        if (!p) { p = { id: newId(s, 'p'), photo: null, freq: 0, fixed: false, priv: false }; s.players.push(p); }
        Object.assign(p, { name, gender: a.gender, skill: clampSkill(a.skill), paid: !!a.paid, guest: !!a.guest });
        if (a.fixed !== undefined) p.fixed = !!a.fixed && !p.guest;
        if (a.priv !== undefined) p.priv = !!a.priv && !p.guest;
        return ok;
      }
      case 'deletePlayer': {
        s.players = s.players.filter(x => x.id !== a.id);
        for (const g of Object.values(s.games)) {
          g.presences = g.presences.filter(x => x.pid !== a.id);
          g.out = g.out.filter(id => id !== a.id);
          delete g.roles[a.id];
          if (g.teams) g.teams.list = g.teams.list.map(t => t.filter(id => id !== a.id));
        }
        return ok;
      }
      case 'togglePaid': { const p = pm[a.id]; if (p) p.paid = !p.paid; return ok; }
      case 'toggleFixed': {
        const p = pm[a.id];
        if (!p || p.guest) return fail('Convidado não pode ter vaga garantida.');
        p.fixed = !p.fixed;
        for (const g of Object.values(s.games)) {
          if (p.fixed && g.meta.fixed) g.presences = g.presences.filter(x => x.pid !== p.id);
          if (!p.fixed) g.out = g.out.filter(id => id !== p.id);
        }
        return ok;
      }
      case 'togglePriv': {
        const p = pm[a.id];
        if (!p || p.guest) return fail('Convidado não precisa da bolinha: quem trouxe já tem acesso.');
        p.priv = !p.priv;
        if (!p.priv) for (const g of Object.values(s.games)) if (g.meta.private) g.presences = g.presences.filter(x => x.pid !== p.id);
        return ok;
      }
      case 'settings': {
        const st = s.settings;
        if (a.groupName !== undefined) st.groupName = cleanName(a.groupName) || 'Vôlei Gran Felicitá';
        if (a.guestLimit !== undefined) st.guestLimit = Math.min(10, Math.max(0, Math.round(Number(a.guestLimit) || 0)));
        if (a.paidPriority !== undefined) st.paidPriority = !!a.paidPriority;
        return ok;
      }
      case 'schedule': {
        if (!Array.isArray(a.schedule) || a.schedule.length > 7) return fail('Horários inválidos.');
        const list = [];
        for (const g of a.schedule) {
          const day = Number(g.day), openDay = Number(g.openDay);
          const start = cleanTime(g.start), end = cleanTime(g.end), openTime = cleanTime(g.openTime);
          if (!(day >= 0 && day <= 6 && openDay >= 0 && openDay <= 6) || !start || !end || !openTime) return fail('Preencha dia e horários de todos os jogos.');
          if (toMins(end) <= toMins(start)) return fail('O horário de fim precisa ser depois do início.');
          if (list.some(x => x.day === day)) return fail(`Tem dois jogos na ${DAYS[day].toLowerCase()}.`);
          list.push({
            day, start, end, openDay, openTime,
            max: Math.min(60, Math.max(4, Math.round(Number(g.max) || 24))),
            teams: Math.min(8, Math.max(2, Math.round(Number(g.teams) || 4))),
            private: !!g.private, fixed: !!g.fixed, guests: !!g.guests
          });
        }
        s.settings.schedule = list.sort((x, y) => x.day - y.day);
        normalize(s, now);
        return ok;
      }
      case 'lockNow': {
        const m = Math.min(60 * 24 * 7, Math.max(1, Math.round(Number(a.minutes) || 0)));
        s.settings.manualLockUntil = now + m * 60000;
        return ok;
      }
      case 'unlock': s.settings.manualLockUntil = 0; return ok;
      case 'resetFreq': s.players.forEach(p => { p.freq = 0; }); return ok;
      case 'resetPaid': s.players.forEach(p => { p.paid = false; }); return ok;
      case 'deleteSuggestion': s.suggestions = s.suggestions.filter(x => x.id !== a.id); return ok;
    }
    return fail('Ação desconhecida.');
  }

  function gameAction(s, v, a, c) {
    const { now, admin, me, limit, pm } = c;
    const fail = error => ({ ok: false, error });
    const ok = { ok: true };
    const meta = v.current;
    const lk = lockInfo(v, now);
    const lockMsg = lk.reason === 'notOpen' ? 'O check-in ainda não abriu.' : 'A lista está fechada agora.';
    const locked = lk.locked && !admin;
    const log = (act, pid) => { v.log.unshift({ ts: now, by: me ? me.id : null, act, pid: pid || null }); if (v.log.length > 300) v.log.length = 300; };
    const addedByMe = () => v.presences.filter(x => x.by === a.by && x.pid !== a.by && pm[x.pid] && pm[x.pid].guest).length;
    const limitMsg = limit ? `Você já trouxe ${limit} convidado${limit > 1 ? 's' : ''}. Esse é o limite.` : 'Esse grupo não aceita convidados.';
    const isFixedHere = p => meta.fixed && p.fixed && canSee(meta, p);

    switch (a.type) {
      case 'join': {
        const p = pm[a.pid];
        if (!p) return fail('Jogador não encontrado.');
        if (!p.guest && !canSee(meta, p)) return fail(`${p.name} não tem a bolinha desse jogo.`);
        if (p.guest && !meta.guests && !admin) return fail('Esse jogo não aceita convidados.');
        if (isFixedHere(p)) {
          if (!admin && a.pid !== a.by) return fail('Só a própria pessoa ou um admin mexe na vaga da comissão.');
          v.out = v.out.filter(id => id !== p.id); log('add', p.id); return ok;
        }
        if (!admin && p.id !== a.by && !p.guest) return fail('Cada um só marca o próprio nome.');
        if (locked) return fail(lockMsg);
        if (v.presences.some(x => x.pid === p.id)) return ok;
        if (!admin && p.id !== a.by && addedByMe() >= limit) return fail(limitMsg);
        v.presences.push({ pid: p.id, by: me ? me.id : null, ts: now });
        log('add', p.id);
        return ok;
      }
      case 'leave': {
        const p = pm[a.pid];
        if (p && isFixedHere(p)) {
          if (!admin && a.pid !== a.by) return fail('Só a própria pessoa ou um admin mexe na vaga da comissão.');
          if (!v.out.includes(p.id)) v.out.push(p.id);
          delete v.roles[a.pid]; log('remove', p.id); return ok;
        }
        const pres = v.presences.find(x => x.pid === a.pid);
        if (!pres) return ok;
        if (!admin && a.pid !== a.by && !(p && p.guest && pres.by === a.by)) return fail(p && p.guest ? 'Só quem trouxe o convidado pode tirar.' : 'Cada um só desmarca o próprio nome.');
        if (locked && lk.reason !== 'notOpen') return fail(lockMsg);
        const before = v.presences.length;
        v.presences = v.presences.filter(x => x.pid !== a.pid);
        if (v.presences.length === before) return ok;
        delete v.roles[a.pid];
        log('remove', a.pid);
        return ok;
      }
      case 'addGuest': {
        if (!meta.guests && !admin) return fail('Esse jogo não aceita convidados.');
        if (locked) return fail(lockMsg);
        const name = cleanName(a.name);
        if (name.length < 2) return fail('Escreva o nome do convidado.');
        if (a.gender !== 'F' && a.gender !== 'M') return fail('Escolha o gênero do convidado.');
        if (!admin && addedByMe() >= limit) return fail(limitMsg);
        let p = s.players.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (p && !p.guest) return fail(`${p.name} já está no grupo. Marque na lista.`);
        if (!p) {
          p = { id: newId(s, 'c'), name, gender: a.gender, skill: clampSkill(a.skill), paid: false, guest: true, fixed: false, priv: false, photo: null, freq: 0 };
          s.players.push(p);
          v.players = s.players;
        }
        if (v.presences.some(x => x.pid === p.id)) return fail(`${p.name} já está na lista.`);
        v.presences.push({ pid: p.id, by: me ? me.id : null, ts: now });
        log('add', p.id);
        return ok;
      }
      case 'role': {
        if (!['setter', 'late'].includes(a.role) || !pm[a.pid]) return fail('Ação inválida.');
        const r = v.roles[a.pid] || {};
        r[a.role] = !r[a.role];
        v.roles[a.pid] = r;
        return ok;
      }
      case 'draw': {
        const d = derive(v);
        if (d.confirmed.length < 4) return fail('Precisa de pelo menos 4 confirmados pra sortear.');
        v.teams = { ts: now, by: me ? me.id : null, list: drawTeams(v, d.confirmed, c.rand) };
        log('draw');
        return ok;
      }
      case 'resetPresences': {
        if (!admin) return fail('Só quem é admin pode fazer isso.');
        const d = derive(v);
        d.confirmed.forEach(pid => { if (pm[pid]) pm[pid].freq = (pm[pid].freq || 0) + 1; });
        s.history.unshift({ id: meta.id, confirmed: d.confirmed });
        v.presences = []; v.out = []; v.roles = {}; v.teams = null; v.log = [];
        return ok;
      }
    }
    return fail('Ação desconhecida.');
  }

  /* O que cada pessoa recebe: sem nível (só admin), sem sugestões (só admin) e sem
     os jogos fechados para quem não tem a bolinha. */
  function publicState(s, isAdmin, meId) {
    if (isAdmin) return Object.assign({}, s);
    const me = s.players.find(p => p.id === meId);
    const priv = !!(me && me.priv && !me.guest);
    const games = {};
    for (const [id, g] of Object.entries(s.games)) if (!g.meta.private || priv) games[id] = g;
    const players = s.players.map(p => { const q = Object.assign({}, p); delete q.skill; return q; });
    const settings = Object.assign({}, s.settings, { schedule: (s.settings.schedule || []).filter(g => !g.private || priv) });
    return Object.assign({}, s, { players, games, settings, suggestions: [] });
  }

  /* Texto das listas abertas (só jogos públicos) — para o robô do WhatsApp. */
  function resumo(s) {
    const pm = playerMap(s), out = [];
    const nm = id => pm[id].name + (pm[id].guest ? ' (C)' : '');
    for (const g of Object.values(s.games).sort((a, b) => a.meta.startAt - b.meta.startAt)) {
      if (g.meta.private) continue;
      const d = derive(view(s, g.meta.id));
      out.push(`🏐 ${gameTitle(g.meta)} (${gameWhen(g.meta)}) — ${d.confirmed.length}/${g.meta.max}`,
        ...d.fixed.map(id => `⭐ ${nm(id)}`), ...d.regular.map((id, i) => `${i + 1}. ${nm(id)}`));
      if (d.waitlist.length) out.push('Espera:', ...d.waitlist.map((id, i) => `${i + 1}. ${nm(id)}`));
      out.push('');
    }
    return out.join('\n').trim();
  }

  return { resumo, DAYS, DAYS_SHORT, MONTHS, initialState, normalize, activeGames, view, gameTitle, gameWhen, derive, apply, lockInfo, drawTeams, publicState, ADMIN_ONLY };
});

let demo = null;

const Backend = {
  async load() {
    if (mode === 'demo') return demoPayload();
    const r = await fetch('api/state?me=' + encodeURIComponent(me || ''), { headers: token ? { 'x-admin-token': token } : {}, cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);

    if (!j || !j.state) throw new Error('resposta inválida');
    return j;
  },
  async act(a) {
    if (mode === 'demo') {
      if (a.type === 'login') return a.password === 'admin' ? { ok: true, token: 'demo' } : { ok: false, error: 'Senha incorreta. Na demonstração a senha é admin.' };
      const r = LG.apply(demo, a, { isAdmin: token === 'demo', now: Date.now() });
      if (r.ok) store.set('demoState6', demo);
      return Object.assign(r, demoPayload());
    }
    const r = await fetch('api/action', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { 'x-admin-token': token } : {}), body: JSON.stringify(a) });

  }

function seedDemo() {
  const s = LG.initialState();
  const F = [['Sophia', 4], ['Ana', 4], ['Bia', 3], ['Carla', 2], ['Duda', 5], ['Fernanda', 3], ['Júlia', 2], ['Lara', 4], ['Marina', 3], ['Natália', 3], ['Paula', 2]];
  const M = [['Fábio', 4], ['André', 4], ['Bruno', 3], ['Caio', 5], ['Diego', 2], ['Eduardo', 3], ['Felipe', 4], ['Gustavo', 3], ['Henrique', 2], ['Igor', 3], ['João', 5], ['Lucas', 3], ['Mateus', 4], ['Otávio', 3], ['Rafael', 2], ['Tiago', 3], ['Vitor', 4]];
  const PRIV = new Set(['Sophia', 'Fábio', 'Ana', 'Duda', 'Lara', 'Marina', 'André', 'Caio', 'Felipe', 'João', 'Mateus', 'Otávio', 'Vitor', 'Bruno', 'Igor', 'Carla']);
  const add = (name, g, sk, guest) => { const id = 'd' + (s.seq++); s.players.push({ id, name, gender: g, skill: sk, paid: !guest && Math.random() < .5, guest: !!guest, fixed: name === 'Sophia' || name === 'Fábio', priv: PRIV.has(name), photo: null, freq: guest ? 0 : Math.floor(Math.random() * 25) }); return id; };
  F.forEach(([n, k]) => add(n, 'F', k)); M.forEach(([n, k]) => add(n, 'M', k));
  const g1 = add('Pedro', 'M', 3, true), g2 = add('Sofia', 'F', 2, true);
  LG.normalize(s, Date.now());
  for (const g of Object.values(s.games)) {
    const ids = s.players.filter(p => !p.guest && !(g.meta.fixed && p.fixed) && (!g.meta.private || p.priv)).map(p => p.id);
    const base = Math.min(Date.now() - 36e5, g.meta.openAt);
    const n = g.meta.private ? 11 : 23;
    ids.slice(0, n).forEach((id, i) => g.presences.push({ pid: id, by: id, ts: base + i * 47e3 }));
    if (!g.meta.private) g.presences.push({ pid: g1, by: ids[3], ts: base + 24 * 47e3 }, { pid: g2, by: ids[0], ts: base + 25 * 47e3 });
    g.presences.slice().reverse().slice(0, 6).forEach(p => g.log.push({ ts: p.ts, by: p.by, act: 'add', pid: p.pid }));
  }
  return s;
}

let RAW = null, GL = [], sel = store.get('game', null);
function applyPayload(j) {
  RAW = j.state; isAdmin = !!j.isAdmin;
  if (j.now) skew = j.now - Date.now();
  const changed = j.version !== version; version = j.version;
  if (me && !RAW.players.some(p => p.id === me && !p.guest)) { me = null; store.set('me', null); }
  if (token && !isAdmin) { token = null; store.set('token', null); }
  GL = Object.values(RAW.games || {}).map(g => g.meta).sort((a, b) => a.startAt - b.startAt);
  if (!GL.some(g => g.id === sel)) sel = (GL.find(g => now() >= g.openAt) || GL[0] || {}).id || null;
  aliasGame();
  return changed;
}
function aliasGame() {
  const g = sel && RAW.games[sel];
  S = Object.assign({}, RAW, g
    ? { current: g.meta, presences: g.presences, out: g.out, roles: g.roles, teams: g.teams, log: g.log, settings: Object.assign({}, RAW.settings, { max: g.meta.max, teams: g.meta.teams }) }

}

  a.by = me; if (a.game === undefined) a.game = sel;
  let r;
  try { r = await Backend.act(a); } catch (e) { toast('Sem conexão. Tente de novo.', true); render(); return false; }
  if (r.token) { token = r.token; store.set('token', token); }
  if (r.state) applyPayload(r);
  else if (r.ok && a.type === 'login') { try { applyPayload(await Backend.load()); } catch (e) {} }
  lastResult = r;
  if (!r.ok) { toast(r.error || 'Não deu certo.', true); render(); return false; }
  render();
  (clear || []).forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  if (okMsg) toast(okMsg);
  return true;
}

/* ---------- Utilidades de exibição ---------- */
const P = id => S.players.find(p => p.id === id);
const nameOf = p => p ? p.name + (p.guest ? ' (C)' : '') : '—';
const byName = (a, b) => a.name.localeCompare(b.name, 'pt-BR');
function hue(str) { let x = 0; for (const c of str) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
function avatar(p, lg) {
  if (!p) return '';
  if (p.photo) return `<img class="av${lg ? ' lg' : ''}" src="${h(p.photo)}" alt="">`;
  return `<span class="av${lg ? ' lg' : ''}" style="background:hsl(${hue(p.name)} 52% 44%)" aria-hidden="true">${h(p.name.trim()[0] || '?').toUpperCase()}</span>`;
}
const fmtTime = ts => new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).format(new Date(ts));
const fmtDay = ts => new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).format(new Date(ts));
const fmtLong = ts => new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Sao_Paulo' }).format(new Date(ts));
const spDate = ts => { const d = new Date(ts - 3 * 3600e3); return { d: d.getUTCDate(), m: d.getUTCMonth(), wd: d.getUTCDay() }; };
const gameTitle = () => LG.gameTitle(S.current);
const whenText = () => S.current ? `${fmtLong(S.current.startAt)} · ${S.current.start}–${S.current.end}` : '';
const opensText = g => `${fmtLong(g.openAt)}, às ${fmtTime(g.openAt)}`;
const locked = () => LG.lockInfo(S, now()).locked && !isAdmin;
const canEdit = () => (!!me || isAdmin) && !locked();
const canEditFixed = p => isAdmin || me === p.id;
const opts = (list, val) => list.map(([v, t]) => `<option value="${h(v)}"${String(v) === String(val) ? ' selected' : ''}>${h(t)}</option>`).join('');
const SKILLS = [[1, '1 · começando'], [2, '2 · básico'], [3, '3 · médio'], [4, '4 · bom'], [5, '5 · muito bom']];
const GENDERS = [['F', 'Mulher'], ['M', 'Homem']];
const DAY_OPTS = LG.DAYS.map((d, i) => [i, d]);
const privLabel = () => (RAW.settings.schedule || []).filter(g => g.private).map(g => LG.DAYS[g.day].toLowerCase()).join(' e ') || 'jogo fechado';

function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }
function listText() {
  const st = S.settings;
  const lines = [`🏐 *${gameTitle()} — Gran Felicitá*`, whenText(), '', `*Confirmados ${D.confirmed.length}/${st.max}*`];
  D.fixed.forEach(id => lines.push(`⭐ ${nameOf(P(id))} (comissão)`));
  D.regular.forEach((id, i) => lines.push(`${i + 1}. ${nameOf(P(id))}`));
  if (D.waitlist.length) lines.push('', '*Lista de espera*', ...D.waitlist.map((id, i) => `${i + 1}. ${nameOf(P(id))}`));
  if (mode === 'server') lines.push('', 'Check-in: ' + location.origin + location.pathname);
  return lines.join('\n');
}

/* ---------- Render ---------- */
function render() {
  if (!S) return;
  const keep = {};
  document.querySelectorAll('#main input[id], #main select[id], #main textarea[id]').forEach(el => { if (el.type !== 'checkbox' && el.type !== 'file') keep[el.id] = el.value; });
  const focusId = document.activeElement && document.activeElement.id;
  $('#hdr').innerHTML = renderHeader();
  $('#main').innerHTML = ({ lista: renderLista, times: renderTimes, freq: renderFreq, mais: renderMais }[tab] || renderLista)();
  for (const id in keep) { const el = document.getElementById(id); if (el) el.value = keep[id]; }
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus({ preventScroll: true }); }
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  filterList();
  document.title = S.settings.groupName ? `${S.settings.groupName} · Vôlei` : 'Gran Felicitá Vôlei';
}

function renderHeader() {
  const st = S.settings, g = S.current, lk = LG.lockInfo(S, now());
  let chip;
  if (lk.reason === 'notOpen') chip = `<span class="chip chip-lock">Check-in abre ${LG.DAYS_SHORT[spDate(g.openAt).wd]} às ${fmtTime(g.openAt)}</span>`;
  else if (lk.locked) chip = `<span class="chip chip-lock">${lk.reason === 'noGame' ? 'Sem jogo marcado' : 'Lista fechada até ' + fmtTime(lk.until)}</span>`;
  else chip = '<span class="chip chip-open">Check-in aberto</span>';
  const cal = g ? (() => { const p = spDate(g.startAt); return `<div class="cal" aria-label="${h(fmtLong(g.startAt))}"><span class="cal-m">${LG.MONTHS[p.m]}</span><span class="cal-d">${p.d}</span><span class="cal-w">${LG.DAYS[p.wd]}</span></div>`; })() : '';
  return `
    <img class="swallow" src="${IMG.glide}" alt="">
    <div class="brand"><img src="${IMG.badge}" alt="Escudo Gran Felicitá">
      <div class="grow"><span class="eyebrow">${h(st.groupName)} <span class="stars" aria-hidden="true">★★</span></span><span>${chip}</span></div></div>
    ${GL.length > 1 ? `<div class="gsel" role="tablist" aria-label="Jogos">${GL.map(x => { const q = spDate(x.startAt); return `<button role="tab" data-game="${x.id}" aria-selected="${x.id === sel}">${LG.DAYS_SHORT[x.day]} ${q.d}/${q.m + 1}${x.private ? ICON.ball : ''}</button>`; }).join('')}</div>` : ''}
    <div class="game">${cal}<div class="game-t"><h1>${h(gameTitle())}</h1><div class="when">${g ? `${g.start} às ${g.end}` : 'Peça pra um admin configurar os dias'}</div></div></div>
    <div class="tally"><span class="count">${D.confirmed.length}<small>/${st.max}</small></span><br><span class="count-label">confirmados${D.fixed.length ? ` · ${D.fixed.length} da comissão` : ''}${D.waitlist.length ? ` · ${D.waitlist.length} na espera` : ''}</span></div>`;
}

function renderWho() {
  const p = me && P(me);
  if (!p) return `<div class="card who"><div class="grow"><b>Quem é você?</b><div class="hint">Escolha seu nome pra fazer check-in.</div></div><button class="btn btn-primary" data-act="whoami">Escolher</button></div>`;
  const mine = S.presences.filter(x => x.by === me && x.pid !== me && P(x.pid) && P(x.pid).guest).length, lim = S.settings.guestLimit;
  const allowG = !S.current || S.current.guests !== false;
  const sub = p.fixed && S.current && S.current.fixed ? 'Você tem vaga garantida da comissão' : allowG && lim ? `Você só marca o seu nome · trouxe ${mine} de ${lim} convidado${lim > 1 ? 's' : ''}` : 'Você só marca e desmarca o seu nome';
  return `<div class="card who">${avatar(p)}<div class="grow"><b>${h(p.name)}</b><div class="hint">${sub}</div></div><button class="link" data-act="whoami">Trocar</button></div>`;
}

function renderLista() {
  const demoNote = mode === 'demo' ? '<div class="demo"><b>Demonstração.</b> Os nomes são exemplos e tudo fica só neste aparelho. A senha de admin aqui é <b>admin</b> (admin consegue mexer mesmo com o check-in fechado).</div>' : '';
  const priv = S.current && S.current.private;
  const members = S.players.filter(p => !p.guest && (!priv || p.priv)).sort(byName);
  const fxHere = p => !!(S.current && S.current.fixed && p.fixed && (!priv || p.priv));
  if (!S.players.length) return demoNote + `<div class="card empty"><img class="mascot" src="${IMG.front}" alt=""><h2>Ninguém cadastrado ainda</h2><p>Quem é admin cadastra os jogadores em <b>Mais → Admin</b>.</p></div>`;
  const pos = {};
  D.fixed.forEach(id => pos[id] = '<span class="pos fx">comissão</span>');
  D.regular.forEach((id, i) => pos[id] = `<span class="pos">${i + 1}º</span>`);
  D.waitlist.forEach((id, i) => pos[id] = `<span class="pos wait">espera ${i + 1}</span>`);
  const edit = canEdit();
  const allowGuests = !S.current || S.current.guests !== false;
  const row = p => {
    const pres = S.presences.find(x => x.pid === p.id);
    const mine = isAdmin || p.id === me || (p.guest && allowGuests && (!pres || pres.by === me));
    const on = !!pos[p.id], can = fxHere(p) ? canEditFixed(p) : edit && mine;
    return `<label class="row${on ? ' on' : ''}" data-n="${h(norm(p.name))}"><input type="checkbox" data-toggle="${p.id}"${on ? ' checked' : ''}${can ? '' : ' disabled'} aria-label="${h(nameOf(p))}">${avatar(p)}<span class="nm">${h(nameOf(p))}</span>${p.paid ? '<span class="paid">pago</span>' : ''}${pos[p.id] || (fxHere(p) ? '<span class="pos wait">não vai</span>' : '')}</label>`;
  };
  const section = (title, list) => list.length ? `<div class="card" data-sec><div class="sec-h"><h2>${title}</h2><span class="muted">${list.filter(p => pos[p.id]).length} de ${list.length}</span></div><div class="list">${list.map(row).join('')}</div></div>` : '';
  const guests = S.players.filter(p => p.guest && (allowGuests || pos[p.id])).sort((a, b) => (pos[b.id] ? 1 : 0) - (pos[a.id] ? 1 : 0) || byName(a, b));
  const lk = LG.lockInfo(S, now());
  let lockMsg = '';
  if (lk.reason === 'notOpen') lockMsg = `<div class="card opens"><img class="mascot sm" src="${IMG.front}" alt=""><div><b>O check-in abre ${h(opensText(S.current))}</b><div class="hint">${isAdmin ? 'Você é admin e já consegue mexer na lista.' : 'Volte nesse horário. Quem marcar primeiro garante a vaga.'}</div></div></div>`;
  else if (lk.locked && !isAdmin) lockMsg = `<div class="notice">A lista está fechada agora. Só quem é admin consegue mexer.</div>`;
  const prio = S.settings.paidPriority;
  const li = id => { const x = S.presences.find(y => y.pid === id) || {}; const p = P(id); const by = x.by && x.by !== id && P(x.by) ? `<span class="by">por ${h(P(x.by).name)}</span>` : ''; const t = x.ts ? `<span class="by">${fmtTime(x.ts)}</span>` : ''; return `<li>${avatar(p)}<span class="nm">${h(nameOf(p))} ${p.paid ? '<span class="paid">pago</span>' : ''}</span>${by || t}</li>`; };
  return `${demoNote}${renderWho()}${lockMsg}
    <p class="hint" style="padding:0 4px">Check-in por ordem de chegada: as <b>${D.open} vagas</b> vão pra quem marcar primeiro${prio ? ' (quem tem <span class="paid">pago</span> passa na frente)' : ''}. Depois disso, entra na lista de espera, que sobe sozinha se alguém desistir. Cada um só marca e desmarca o próprio nome.</p>
    <div class="card search"><label class="lbl" for="list-q">Procurar na lista</label><input type="search" id="list-q" placeholder="Digite um nome…" autocomplete="off" enterkeyhint="search"></div>
    ${section('Mulheres', members.filter(p => p.gender === 'F'))}
    ${section('Homens', members.filter(p => p.gender !== 'F'))}
    ${section('Convidados', guests)}
    ${edit && allowGuests && S.settings.guestLimit ? `<div class="card"><h2>Trazer um convidado</h2>
      <div class="field"><label for="g-name">Nome</label><input type="text" id="g-name" maxlength="40" autocomplete="off" placeholder="Nome do convidado"></div>
      <div class="grid2"><div class="field"><label for="g-gender">Gênero</label><select id="g-gender"><option value="">Escolha</option>${opts(GENDERS)}</select></div>
      <div class="field"><label for="g-skill">Nível</label><select id="g-skill">${opts(SKILLS, 3)}</select></div></div>
      <button class="btn btn-primary" data-act="addGuest">Adicionar convidado</button></div>` : ''}
    <div class="card"><div class="sec-h"><h2>Confirmados</h2><span class="muted">${D.confirmed.length}/${S.settings.max}</span></div>
      ${D.fixed.length ? `<ul class="conf fx">${D.fixed.map(id => `<li>${avatar(P(id))}<span class="nm">${h(nameOf(P(id)))}</span><span class="by">vaga garantida</span></li>`).join('')}</ul>` : ''}
      ${D.regular.length ? `<ol class="conf">${D.regular.map(li).join('')}</ol>` : '<p class="hint">Ninguém fez check-in ainda.</p>'}
      ${D.waitlist.length ? `<h3 style="font-size:1rem;color:var(--warn)">Lista de espera</h3><ol class="conf wait">${D.waitlist.map(li).join('')}</ol>` : ''}
      <a class="btn btn-wa" href="${h(waLink(listText()))}" target="_blank" rel="noopener">${ICON.wa}Mandar lista no WhatsApp</a>
    </div>
    ${S.log.length ? `<div class="card"><h2>O que aconteceu</h2><ul class="log">${S.log.slice(0, 20).map(l => {
      const who = l.by && P(l.by) ? h(P(l.by).name) : 'Admin';
      const what = l.act === 'add' ? `<span class="add">marcou</span> ${h(nameOf(P(l.pid)))}` : l.act === 'remove' ? `<span class="rem">tirou</span> ${h(nameOf(P(l.pid)))}` : 'sorteou os times';
      return `<li><time>${fmtTime(l.ts)}</time><span>${who} ${what}</span></li>`; }).join('')}</ul></div>` : ''}`;
}

function renderTimes() {
  const conf = D.confirmed.map(P).filter(Boolean);
  const enabled = !!me || isAdmin;
  const nT = Math.max(2, Math.min(Math.floor(D.confirmed.length / 2), S.settings.teams || 4));
  let teamsHtml = '';
  if (S.teams && S.teams.list.length) {
    const inTeams = new Set(S.teams.list.flat());
    const stale = D.confirmed.length !== inTeams.size || D.confirmed.some(id => !inTeams.has(id));
    teamsHtml = `${stale ? '<div class="notice">A lista mudou depois do sorteio. Sorteie de novo se precisar.</div>' : ''}
      <div class="teams">${S.teams.list.map((t, i) => {
        const ps = t.map(P).filter(Boolean);
        const sum = ps.reduce((a, p) => a + (Number(p.skill) || 0), 0);
        const f = ps.filter(p => p.gender === 'F').length;
        return `<section class="team"><header><h3>Time ${i + 1}</h3><span class="small">${ps.length} jogadores</span></header><ul>${ps.map(p => `<li>${avatar(p)}<span>${h(nameOf(p))}</span></li>`).join('')}</ul>
          <footer>${ps.length - f} homens · ${f} mulheres${isAdmin ? ` · nível ${sum}` : ''}${ps.length > 6 ? `<br><b>Time com ${ps.length}:</b> joga quem chegar primeiro, os outros entram no rodízio.` : ''}</footer></section>`; }).join('')}</div>
      <p class="hint">Sorteado às ${fmtTime(S.teams.ts)}${S.teams.by && P(S.teams.by) ? ' por ' + h(P(S.teams.by).name) : ''}.</p>
      <a class="btn btn-wa" href="${h(waLink(teamsText()))}" target="_blank" rel="noopener">${ICON.wa}Mandar times no WhatsApp</a>`;
  }
  return `<div class="card"><h2>Sorteio dos times</h2>
      <p class="hint">${S.settings.teams || 4} times, equilibrados entre homens e mulheres e pelo nível de cada um. Entram os ${D.confirmed.length} confirmados${D.confirmed.length >= 4 ? ` (${nT} times de ${Math.floor(D.confirmed.length / nT)}${D.confirmed.length % nT ? ' ou ' + Math.ceil(D.confirmed.length / nT) : ''})` : ''}.</p>
      <button class="btn btn-ball" data-act="draw"${conf.length >= 4 && enabled ? '' : ' disabled'} style="font-size:1.05rem">${ICON.shuffle}Sortear times</button>
      ${!enabled ? '<p class="hint">Escolha quem você é na aba Lista pra sortear.</p>' : conf.length < 4 ? '<p class="hint">Precisa de pelo menos 4 confirmados.</p>' : ''}
    </div>
    ${teamsHtml}`;
}
function teamsText() {
  return [`🏐 *Times — ${gameTitle()}*`, ...S.teams.list.map((t, i) => `\n*Time ${i + 1}*\n` + t.map(P).filter(Boolean).map(p => '• ' + nameOf(p)).join('\n'))].join('\n');
}

function renderFreq() {
  const list = S.players.filter(p => !p.guest || p.freq > 0).slice().sort((a, b) => (b.freq || 0) - (a.freq || 0) || byName(a, b));
  const max = Math.max(1, ...list.map(p => p.freq || 0));
  return `<div class="card"><h2>Quem mais veio</h2>
    <p class="hint">Quando o jogo acaba, soma 1 pra quem estava confirmado.</p>
    ${list.length ? `<div class="freq">${list.map(p => `<div class="fbar"><span class="nm">${h(nameOf(p))}</span><span class="track"><span class="fill" style="width:${Math.round((p.freq || 0) / max * 100)}%;display:block"></span></span><b>${p.freq || 0}</b></div>`).join('')}</div>` : '<p class="hint">Ninguém cadastrado ainda.</p>'}
  </div>`;
}

function renderMais() {
  const p = me && P(me);
  const theme = store.get('theme', 'auto');
  const st = S.settings;
  const sched = st.schedule || [];
  let html = '';
  if (p) html += `<div class="card"><h2>Sua foto</h2><div class="who">${avatar(p, true)}<div class="grow btns">
      <label class="btn btn-ghost btn-sm" for="photo-in">Escolher foto</label><input type="file" id="photo-in" accept="image/*" hidden>
      ${p.photo ? '<button class="btn btn-ghost btn-sm" data-act="photo-del">Tirar foto</button>' : ''}</div></div></div>`;
  html += `<div class="card"><h2>Sugestões pros admins</h2>
      <div class="field"><label for="sug-text">Sua mensagem</label><textarea id="sug-text" maxlength="1000" placeholder="Ideias, reclamações, elogios…"></textarea></div>
      <div class="btns"><button class="btn btn-ghost" data-act="sug-anon">Enviar anônima</button><button class="btn btn-primary" data-act="sug-sign"${p ? '' : ' disabled'}>Enviar com meu nome</button></div></div>
    <div class="card"><h2>Tema</h2><div class="seg" role="group" aria-label="Tema">
      ${[['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([v, t]) => `<button data-theme-set="${v}" aria-pressed="${theme === v}">${t}</button>`).join('')}</div></div>
    <div class="card"><details><summary>Como a lista funciona</summary><ul class="rules" style="margin-top:10px">
      ${sched.map(g => `<li><b>${LG.DAYS[g.day]}</b>, das ${h(g.start)} às ${h(g.end)}: ${g.max} vagas${g.fixed ? ' (a comissão já tem vaga garantida)' : ''}${g.guests === false ? ', sem convidados' : ''}. Check-in abre ${LG.DAYS[g.openDay].toLowerCase()} às ${h(g.openTime)}.</li>`).join('')}
      <li>As vagas vão por ordem de check-in.</li>
      ${st.paidPriority ? '<li>Quem pagou a vaquinha passa na frente de quem não pagou.</li>' : ''}
      <li>Passou das vagas, entra na lista de espera, que sobe sozinha quando alguém desiste.</li>
      <li>Cada pessoa só marca e desmarca o próprio nome.${st.guestLimit ? ` Nos jogos que aceitam convidados, cada um pode trazer até ${st.guestLimit}, e só quem trouxe pode tirar.` : ''}</li>
      <li>Quando o jogo acaba, a lista zera sozinha e já mostra o próximo jogo. Quem estava confirmado ganha +1 na frequência.</li>
      <li>O sorteio monta ${st.teams || 4} times equilibrando homens, mulheres e nível. O nível de cada um só o admin vê.</li>
    </ul></details></div>`;

  if (!isAdmin) {
    html += `<div class="card"><h2>Admin</h2><div class="field"><label for="adm-pw">Senha</label><input type="password" id="adm-pw" autocomplete="current-password"></div>
      <button class="btn btn-ghost" data-act="login">Entrar como admin</button></div>`;
    return html;
  }
  const players = S.players.slice().sort((a, b) => (a.guest ? 1 : 0) - (b.guest ? 1 : 0) || (b.fixed ? 1 : 0) - (a.fixed ? 1 : 0) || byName(a, b));
  const lk = LG.lockInfo(S, now());
  html += `<div class="card"><div class="sec-h"><h2>Admin · Dias de jogo</h2><button class="link" data-act="logout">Sair do admin</button></div>
      <p class="hint">O app sempre mostra o próximo jogo e troca sozinho quando um termina.</p>
      ${sched.map((g, i) => `<div class="sched" data-sched="${i}">
        <div class="grid3"><div class="field"><label for="sc-day-${i}">Jogo</label><select id="sc-day-${i}">${opts(DAY_OPTS, g.day)}</select></div>
          <div class="field"><label for="sc-start-${i}">Começa</label><input type="time" id="sc-start-${i}" value="${h(g.start)}"></div>
          <div class="field"><label for="sc-end-${i}">Termina</label><input type="time" id="sc-end-${i}" value="${h(g.end)}"></div></div>
        <div class="grid3"><div class="field"><label for="sc-oday-${i}">Check-in abre</label><select id="sc-oday-${i}">${opts(DAY_OPTS, g.openDay)}</select></div>
          <div class="field"><label for="sc-otime-${i}">Às</label><input type="time" id="sc-otime-${i}" value="${h(g.openTime)}"></div>
          <div class="btns" style="align-items:end"><button class="btn btn-ghost btn-sm" data-schedrm="${i}">Remover</button></div></div>
        <div class="grid3"><div class="field"><label for="sc-max-${i}">Vagas</label><input type="number" id="sc-max-${i}" min="4" max="60" value="${g.max || 24}"></div>
          <div class="field"><label for="sc-teams-${i}">Times</label><input type="number" id="sc-teams-${i}" min="2" max="8" value="${g.teams || 4}"></div></div>
        <label class="check"><input type="checkbox" id="sc-fixed-${i}"${g.fixed ? ' checked' : ''}> Comissão tem vaga garantida</label>
        <label class="check"><input type="checkbox" id="sc-guests-${i}"${g.guests !== false ? ' checked' : ''}> Permite convidados</label>
        <label class="check"><input type="checkbox" id="sc-priv-${i}"${g.private ? ' checked' : ''}> ${ICON.ball} Só pra quem tem a bolinha</label></div>`).join('')}
      <div class="btns"><button class="btn btn-ghost" data-act="add-sched">Adicionar dia</button><button class="btn btn-primary" data-act="save-sched">Salvar dias</button></div></div>

    <div class="card"><h2>Admin · Regras gerais</h2>
      <div class="field"><label for="s-group">Nome do grupo</label><input type="text" id="s-group" value="${h(st.groupName)}"></div>
      <div class="field"><label for="s-limit">Quantos convidados cada um pode trazer</label><input type="number" id="s-limit" min="0" max="10" value="${st.guestLimit}"></div>
      <p class="hint">Vagas e número de times de cada jogo ficam em <b>Dias de jogo</b>, acima.</p>
      <label class="check"><input type="checkbox" id="s-prio"${st.paidPriority ? ' checked' : ''}> Quem pagou a vaquinha passa na frente</label>
      <button class="btn btn-primary" data-act="save-settings">Salvar</button></div>

    <div class="card"><h2>Admin · Jogadores</h2>
      <div class="field"><label for="np-name">Novo jogador</label><input type="text" id="np-name" maxlength="40" placeholder="Nome"></div>
      <div class="grid2"><div class="field"><label for="np-gender">Gênero</label><select id="np-gender"><option value="">Escolha</option>${opts(GENDERS)}</select></div>
        <div class="field"><label for="np-skill">Nível</label><select id="np-skill">${opts(SKILLS, 3)}</select></div></div>
      <label class="check"><input type="checkbox" id="np-paid"> Pagou a vaquinha</label>
      <label class="check"><input type="checkbox" id="np-fixed"> Comissão (vaga garantida)</label>
      <label class="check"><input type="checkbox" id="np-priv"> ${ICON.ball} Liberado pro vôlei de ${h(privLabel())}</label>
      <button class="btn btn-primary" data-act="add-player">Cadastrar</button>
      <details class="bulk"><summary>Cadastrar vários de uma vez</summary>
        <p class="hint">Cole um nome por linha. Se quiser, coloque o nível no fim (ex.: <b>Ana 4</b>). Sem nível, fica 3. Faça uma vez pras mulheres e outra pros homens.</p>
        <div class="field"><label for="bulk-gender">Gênero de todos da lista</label><select id="bulk-gender"><option value="">Escolha</option>${opts(GENDERS)}</select></div>
        <div class="field"><label for="bulk-text">Nomes</label><textarea id="bulk-text" placeholder="Ana 4&#10;Bia&#10;Carla 2"></textarea></div>
        <label class="check"><input type="checkbox" id="bulk-priv"> ${ICON.ball} Todos liberados pro vôlei de ${h(privLabel())}</label>
        <button class="btn btn-primary" data-act="bulk-add">Cadastrar todos</button></details>
      <div>${players.map(q => `<div class="adm-player">${avatar(q)}<b>${h(nameOf(q))}</b>
        <div class="ctrls"><select data-edit="${q.id}" data-field="gender" aria-label="Gênero de ${h(q.name)}">${opts(GENDERS, q.gender)}</select>
          <select data-edit="${q.id}" data-field="skill" aria-label="Nível de ${h(q.name)}">${opts(SKILLS, q.skill)}</select>
          <button class="tog setter" aria-pressed="${!!q.paid}" data-paid="${q.id}">pago</button>
          ${q.guest ? '' : `<button class="tog setter" aria-pressed="${!!q.fixed}" data-fixed="${q.id}">comissão</button><button class="tog setter" aria-pressed="${!!q.priv}" data-priv="${q.id}" title="Vê e faz check-in nos jogos fechados">${ICON.ball}${h(privLabel())}</button>`}
          <button class="btn btn-danger btn-sm" data-del="${q.id}" data-confirm>Excluir</button></div></div>`).join('')}</div></div>

    <div class="card"><h2>Admin · Fechar a lista</h2>
      <p class="hint">${lk.reason === 'manual' ? `Fechada até ${fmtDay(lk.until)}.` : lk.reason === 'notOpen' ? `O check-in abre ${h(opensText(S.current))}.` : 'O check-in está aberto.'} Use isto só se precisar travar a lista fora do horário normal.</p>
      <div class="grid2"><div class="field"><label for="lk-min">Fechar por (minutos)</label><input type="number" id="lk-min" min="1" value="60"></div>
        <div class="btns" style="align-items:end"><button class="btn btn-ghost" data-act="lock">Fechar</button><button class="btn btn-ghost" data-act="unlock"${st.manualLockUntil > now() ? '' : ' disabled'}>Reabrir</button></div></div></div>

    <div class="card"><h2>Admin · Fim de jogo</h2>
      <p class="hint">O jogo encerra sozinho no horário de fim${S.current ? ` (${S.current.end})` : ''}. Use o botão só se quiser encerrar antes: ele soma 1 na frequência de quem estava confirmado e limpa a lista.</p>
      <button class="btn btn-danger" data-act="resetPresences" data-confirm>Encerrar agora e limpar lista</button>
      <div class="btns"><button class="btn btn-danger" data-act="resetPaid" data-confirm>Zerar pagamentos</button><button class="btn btn-danger" data-act="resetFreq" data-confirm>Zerar frequência</button></div></div>

    <div class="card"><h2>Admin · Sugestões recebidas</h2>
      ${S.suggestions.length ? S.suggestions.map(x => `<div class="sug"><div>${h(x.text)}</div><div class="by">${x.by && P(x.by) ? h(P(x.by).name) : 'Anônima'} · ${fmtDay(x.ts)} · <button class="link" data-sugdel="${x.id}">apagar</button></div></div>`).join('') : '<p class="hint">Nenhuma sugestão por enquanto.</p>'}</div>`;
  return html;
}

/* ---------- Folha "quem é você" ---------- */
function openWho() {
  const list = S.players.filter(p => !p.guest).sort(byName);
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-in" role="dialog" aria-modal="true" aria-label="Quem é você?"><div class="sec-h"><h2>Quem é você?</h2><button class="link" data-act="close-sheet">Fechar</button></div>
    <div class="field"><label for="who-q">Digite seu nome</label><input type="search" id="who-q" placeholder="Comece a digitar…" autocomplete="off" autocapitalize="words" enterkeyhint="search"></div>
    <div id="who-list" role="listbox" aria-label="Nomes encontrados">${list.map(p => `<button class="pick" role="option" data-pick="${p.id}" data-n="${h(norm(p.name))}" hidden>${avatar(p)}<span>${h(p.name)}</span></button>`).join('')}</div>
    <p class="hint" id="who-empty">Digite pelo menos uma letra pra ver os nomes.</p>
    <details class="newme"><summary>Não achei meu nome</summary>
      <div class="field"><label for="reg-name">Seu nome (como o grupo te chama)</label><input type="text" id="reg-name" maxlength="40" autocomplete="name"></div>
      <div class="field"><label for="reg-gender">Gênero</label><select id="reg-gender"><option value="">Escolha</option>${opts(GENDERS)}</select></div>
      <button class="btn btn-primary" data-act="register">Me cadastrar</button></details></div>`;
  sh.hidden = false;
  setTimeout(() => { const q = document.getElementById('who-q'); if (q) q.focus(); }, 50);
}
const norm = v => String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
/* Mostra até 8 nomes: primeiro quem tem uma palavra começando com o que foi digitado, depois quem contém. */
function filterWho(qRaw) {
  const q = norm(qRaw), btns = [...document.querySelectorAll('#who-list .pick')];
  const starts = [], has = [];
  btns.forEach(b => { b.hidden = true; if (!q) return; const n = b.dataset.n; if (n.split(/\s+/).some(w => w.startsWith(q))) starts.push(b); else if (n.includes(q)) has.push(b); });
  const show = starts.concat(has).slice(0, 8);
  const list = document.getElementById('who-list');
  show.forEach(b => { b.hidden = false; list.appendChild(b); });
  const empty = document.getElementById('who-empty');
  empty.textContent = !q ? 'Digite pelo menos uma letra pra ver os nomes.' : show.length ? '' : 'Nenhum nome encontrado. Cadastre-se aqui embaixo.';
  empty.hidden = !!(q && show.length);
  if (q && !show.length) { const d = document.querySelector('.newme'); if (d) d.open = true; const r = document.getElementById('reg-name'); if (r && !r.matches(':focus')) r.value = qRaw.trim(); }
}
function filterList() {
  const el = document.getElementById('list-q'); if (!el) return;
  const q = norm(el.value);
  document.querySelectorAll('#main .row[data-n]').forEach(r => { r.hidden = !!q && !r.dataset.n.includes(q); });
  document.querySelectorAll('#main .card[data-sec]').forEach(c => { c.hidden = !!q && !c.querySelector('.row[data-n]:not([hidden])'); });
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }

/* ---------- Eventos ---------- */
let toastTimer;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 4000 : 2200); }
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const readSched = () => [...document.querySelectorAll('[data-sched]')].map(r => { const i = r.dataset.sched; return { day: Number(val('sc-day-' + i)), start: val('sc-start-' + i), end: val('sc-end-' + i), openDay: Number(val('sc-oday-' + i)), openTime: val('sc-otime-' + i), max: Number(val('sc-max-' + i)), teams: Number(val('sc-teams-' + i)), fixed: document.getElementById('sc-fixed-' + i).checked, guests: document.getElementById('sc-guests-' + i).checked, private: document.getElementById('sc-priv-' + i).checked }; });

function armed(btn) {
  if (!btn.hasAttribute('data-confirm') || btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = 'Toque de novo pra confirmar'; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.label; btn.classList.remove('armed'); } }, 4000);
  return false;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button, a');
  if (!t) { if (e.target.id === 'sheet') closeSheet(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; store.set('tab', tab); render(); window.scrollTo(0, 0); return; }
  if (!armed(t)) return;
  if (t.dataset.pick) { me = t.dataset.pick; store.set('me', me); closeSheet(); await refresh(); toast('Oi, ' + P(me).name + '!'); return; }
  if (t.dataset.game) { sel = t.dataset.game; store.set('game', sel); aliasGame(); render(); return; }
  if (t.dataset.priv) return act({ type: 'togglePriv', id: t.dataset.priv });
  if (t.dataset.paid) return act({ type: 'togglePaid', id: t.dataset.paid });
  if (t.dataset.fixed) return act({ type: 'toggleFixed', id: t.dataset.fixed });
  if (t.dataset.schedrm) return act({ type: 'schedule', schedule: readSched().filter((g, i) => i !== Number(t.dataset.schedrm)) }, 'Dia removido.');
  if (t.dataset.del) return act({ type: 'deletePlayer', id: t.dataset.del }, 'Jogador excluído.');
  if (t.dataset.sugdel) return act({ type: 'deleteSuggestion', id: t.dataset.sugdel });
  if (t.dataset.themeSet) { store.set('theme', t.dataset.themeSet); applyTheme(); render(); return; }
  switch (t.dataset.act) {
    case 'whoami': return openWho();
    case 'register': {
      let r;
      try { r = await Backend.act({ type: 'register', name: val('reg-name'), gender: val('reg-gender') }); } catch (e) { toast('Sem conexão. Tente de novo.', true); return; }
      if (r.state) applyPayload(r);
      if (!r.ok) { toast(r.error || 'Não deu certo.', true); return; }
      me = r.id; store.set('me', me); closeSheet(); await refresh(); toast('Cadastrado! Oi, ' + P(me).name + '!'); return;
    }
    case 'bulk-add': return act({ type: 'bulkAdd', text: val('bulk-text'), gender: val('bulk-gender'), priv: document.getElementById('bulk-priv').checked }, null, ['bulk-text']).then(ok => { if (ok && lastResult && lastResult.added != null) toast(`${lastResult.added} cadastrado${lastResult.added === 1 ? '' : 's'}${lastResult.skipped ? `, ${lastResult.skipped} já existia${lastResult.skipped === 1 ? '' : 'm'}` : ''}.`); });
    case 'close-sheet': return closeSheet();
    case 'addGuest': return act({ type: 'addGuest', name: val('g-name'), gender: val('g-gender'), skill: val('g-skill') }, 'Convidado adicionado.', ['g-name']);
    case 'draw': return act({ type: 'draw' }, 'Times sorteados!');
    case 'photo-del': return act({ type: 'photo', pid: me, photo: null }, 'Foto removida.');
    case 'sug-anon': return act({ type: 'suggest', text: val('sug-text'), anon: true }, 'Sugestão enviada. Obrigado!', ['sug-text']);
    case 'sug-sign': return act({ type: 'suggest', text: val('sug-text'), anon: false }, 'Sugestão enviada. Obrigado!', ['sug-text']);
    case 'login': return act({ type: 'login', password: val('adm-pw') }, 'Você entrou como admin.', ['adm-pw']);
    case 'logout': token = null; store.set('token', null); isAdmin = false; await poll(); render(); return;
    case 'save-settings': return act({ type: 'settings', groupName: val('s-group'), guestLimit: val('s-limit'), paidPriority: document.getElementById('s-prio').checked }, 'Salvo.');
    case 'save-sched': return act({ type: 'schedule', schedule: readSched() }, 'Dias salvos.');
    case 'add-sched': { const list = readSched(); const used = new Set(list.map(g => g.day)); const day = [1, 2, 3, 4, 5, 6, 0].find(d => !used.has(d)); if (day === undefined) return; list.push({ day, start: '19:00', end: '22:00', openDay: (day + 6) % 7, openTime: '12:00', max: 24, teams: 4, fixed: true, guests: true, private: false }); return act({ type: 'schedule', schedule: list }, 'Dia adicionado.'); }
    case 'add-player': return act({ type: 'savePlayer', name: val('np-name'), gender: val('np-gender'), skill: val('np-skill'), paid: document.getElementById('np-paid').checked, fixed: document.getElementById('np-fixed').checked, priv: document.getElementById('np-priv').checked }, 'Jogador cadastrado.', ['np-name']);
    case 'lock': return act({ type: 'lockNow', minutes: val('lk-min') }, 'Lista fechada.');
    case 'unlock': return act({ type: 'unlock' }, 'Lista reaberta.');
    case 'resetPresences': return act({ type: 'resetPresences' }, 'Jogo encerrado. Frequência atualizada.');
    case 'resetPaid': return act({ type: 'resetPaid' }, 'Pagamentos zerados.');
    case 'resetFreq': return act({ type: 'resetFreq' }, 'Frequência zerada.');
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.toggle) return act({ type: t.checked ? 'join' : 'leave', pid: t.dataset.toggle });
  if (t.dataset.edit) { const q = P(t.dataset.edit); if (!q) return; return act(Object.assign({ type: 'savePlayer' }, q, { [t.dataset.field]: t.value }), 'Salvo.'); }
  if (t.id === 'photo-in' && t.files && t.files[0]) return uploadPhoto(t.files[0]);
});
document.addEventListener('input', e => {
  if (e.target.id === 'who-q') filterWho(e.target.value);
  if (e.target.id === 'list-q') filterList();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function uploadPhoto(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const c = document.createElement('canvas'), n = 160; c.width = c.height = n;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
    URL.revokeObjectURL(url);
    act({ type: 'photo', pid: me, photo: c.toDataURL('image/jpeg', 0.82) }, 'Foto atualizada.');
  };
  img.onerror = () => toast('Não consegui abrir essa imagem.', true);
  img.src = url;
}

function applyTheme() {
  const t = store.get('theme', 'auto'), root = document.documentElement;
  if (t === 'auto') { if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', t);
}

async function boot() {
  applyTheme();
  try { applyPayload(await Backend.load()); }
  catch (e) { mode = 'demo'; demo = store.get('demoState6', null) || seedDemo(); store.set('demoState6', demo); applyPayload(demoPayload()); }
  render();
  if (mode === 'server') { setInterval(poll, 8000); document.addEventListener('visibilitychange', poll); }
  setInterval(() => { if (S) { const lk = JSON.stringify(LG.lockInfo(S, now())); if (lk !== boot.lk) { boot.lk = lk; render(); } } }, 30000);
}
boot();
})();
</script>
